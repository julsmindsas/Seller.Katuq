<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="/"><title>QA local · soporte Opttia</title>
  <link rel="stylesheet" href="app-styles.css">
  <style>
    body { margin:0; color:#211F3A; background:#f3f1fb; font-family:Arial,sans-serif; }
    * { box-sizing:border-box; }
    .qa-page { padding:16px; }
    .qa-banner { padding:12px; border:1px solid #e9e7f3; border-radius:11px; background:white; font-size:12px; }
    .qa-states { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
    .qa-states button { padding:6px 9px; border:1px solid #ececf4; border-radius:11px; background:white; color:#211F3A; }
    .qa-chat { display:flex; flex-direction:column; width:430px; max-width:100%; height:680px; max-height:80vh; margin:auto; border:1px solid #e9e7f3; border-radius:16px; overflow:hidden; background:#faf9fe; }
    .qa-chat header,.qa-chat footer { flex:none; padding:12px; background:white; font-size:12px; color:#211F3A; }
    .qa-chat header p { margin:4px 0 0; font-size:11px; }
    .qa-scroll { flex:1; min-height:0; overflow:auto; padding:12px; font-size:12.5px; }
    .qa-trace { margin:10px auto; max-width:430px; font-size:12px; color:#211F3A; }
  </style></head><body><support-preview></support-preview><script src="preview.js"></script></body></html>
