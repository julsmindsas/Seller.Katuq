<ngx-loading-bar [color]="'#7366ff'" [includeSpinner]="true" [height]="'4px'"></ngx-loading-bar>
<!-- <app-loader></app-loader> -->

<!-- Las rutas públicas deben seguir utilizables aunque una solicitud de la
     sesión anterior termine tarde después de cerrar sesión. -->
<app-loader-custom *ngIf="!isPublicRoute"></app-loader-custom>

<app-tap-to-top></app-tap-to-top>

<router-outlet></router-outlet>

<!-- Solo mostrar el floating button si NO estamos en una ruta pública Y el usuario está autenticado -->
<app-floating-button *ngIf="!isPublicRoute && authService.isLoggedIn"></app-floating-button>

<!-- Modal "¿Qué hay de nuevo?" — se muestra una sola vez por usuario (localStorage) -->
<app-novedad-modal></app-novedad-modal>
