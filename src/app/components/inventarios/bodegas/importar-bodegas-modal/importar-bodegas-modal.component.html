<div class="modal-header bg-light">
  <div class="d-flex align-items-center">
    <i class="pi pi-cloud-download text-primary me-3" style="font-size: 1.5rem;"></i>
    <div>
      <h5 class="modal-title mb-0">Importar Bodegas de Fulfillment</h5>
      <small class="text-muted">Seleccione las bodegas que desea importar a Katuq</small>
    </div>
  </div>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="cancelar()"></button>
</div>

<div class="modal-body">
  <!-- Filtros -->
  <div class="row mb-3 g-2">
    <div class="col-md-5">
      <label class="form-label small text-muted">Filtrar por proveedor</label>
      <select class="form-select" [(ngModel)]="providerFilter">
        <option value="">Todos los proveedores</option>
        <option *ngFor="let provider of providers" [value]="provider.value">
          {{ provider.label }}
        </option>
      </select>
    </div>
    <div class="col-md-5">
      <label class="form-label small text-muted">Buscar bodega</label>
      <div class="input-group">
        <span class="input-group-text"><i class="pi pi-search"></i></span>
        <input type="text" class="form-control" [(ngModel)]="searchQuery"
               placeholder="Nombre, ciudad, dirección...">
      </div>
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button class="btn btn-outline-secondary w-100" (click)="limpiarFiltros()"
              [disabled]="!providerFilter && !searchQuery">
        <i class="pi pi-filter-slash"></i> Limpiar
      </button>
    </div>
  </div>

  <!-- Contador y acciones de selección -->
  <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
    <div>
      <span class="badge bg-primary me-2">{{ warehousesFiltradas.length }}</span>
      <span class="text-muted">bodegas disponibles</span>
      <span class="text-muted ms-2" *ngIf="contarSeleccionadas() > 0">
        | <strong class="text-success">{{ contarSeleccionadas() }}</strong> seleccionadas
      </span>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="selectAll"
             [(ngModel)]="selectAllChecked" (change)="onSelectAllChange()">
      <label class="form-check-label" for="selectAll">
        Seleccionar todas
      </label>
    </div>
  </div>

  <!-- Lista de bodegas -->
  <div class="warehouse-list" style="max-height: 400px; overflow-y: auto;">
    <!-- Mensaje si no hay bodegas -->
    <div *ngIf="warehousesFiltradas.length === 0" class="text-center py-5 text-muted">
      <i class="pi pi-inbox" style="font-size: 3rem;"></i>
      <p class="mt-3 mb-0">No hay bodegas disponibles para importar</p>
      <small *ngIf="providerFilter || searchQuery">
        Intente ajustar los filtros de búsqueda
      </small>
    </div>

    <!-- Lista de bodegas disponibles -->
    <div *ngFor="let wh of warehousesFiltradas; let i = index"
         class="warehouse-item d-flex align-items-start p-3 border-bottom"
         [class.bg-light]="wh.selected"
         [class.hover-highlight]="!wh.selected">

      <div class="form-check mt-1">
        <input class="form-check-input" type="checkbox"
               [id]="'wh-' + i"
               [(ngModel)]="wh.selected"
               (change)="updateSelectAllState()">
      </div>

      <label class="ms-3 flex-grow-1 cursor-pointer" [for]="'wh-' + i">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <strong class="d-block">{{ wh.name }}</strong>
            <span class="badge bg-info text-white me-2">{{ wh.providerName }}</span>
            <span class="badge bg-secondary" *ngIf="wh.id">
              ID: {{ wh.id | slice:0:8 }}...
            </span>
          </div>
        </div>
        <div class="text-muted small mt-1" *ngIf="getUbicacion(wh) !== 'Sin ubicación'">
          <i class="pi pi-map-marker me-1"></i>
          {{ getUbicacion(wh) }}
        </div>
      </label>

      <div class="ms-2">
        <i class="pi pi-check-circle text-success" style="font-size: 1.2rem;"
           *ngIf="wh.selected"></i>
      </div>
    </div>
  </div>
</div>

<div class="modal-footer bg-light">
  <div class="d-flex justify-content-between w-100 align-items-center">
    <div class="btn-group">
      <button class="btn btn-outline-secondary btn-sm" (click)="selectAll()">
        <i class="pi pi-check-square me-1"></i> Todas
      </button>
      <button class="btn btn-outline-secondary btn-sm" (click)="deselectAll()">
        <i class="pi pi-stop me-1"></i> Ninguna
      </button>
    </div>

    <div>
      <button class="btn btn-secondary me-2" (click)="cancelar()">
        Cancelar
      </button>
      <button class="btn btn-primary" (click)="importarSeleccionadas()"
              [disabled]="!tieneSeleccionadas()">
        <i class="pi pi-download me-1"></i>
        Importar {{ contarSeleccionadas() > 0 ? '(' + contarSeleccionadas() + ')' : '' }}
      </button>
    </div>
  </div>
</div>
