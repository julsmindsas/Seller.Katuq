<div class="cfg-pagina">
  <header class="cfg-cabeza">
    <div class="cfg-cabeza__textos">
      <span class="cfg-eyebrow">{{ 'proceso.comun.configuracion' | translate }}</span>
      <h1 class="cfg-titulo">{{ 'proceso.variables.titulo' | translate }}</h1>
    </div>

    <!-- Como antes del rediseño, las acciones solo se muestran con los datos cargados. -->
    <div class="cfg-acciones" *ngIf="!cargando">
      <button class="cfg-btn" type="button" (click)="crearVariables()">
        <i placement="top" [ngbTooltip]="'proceso.comun.nuevo' | translate" class="icofont icofont-plus"></i>
        <span>{{ 'proceso.variables.crear' | translate }}</span>
      </button>
      <button class="cfg-btn cfg-btn--sec" *ngIf="userNit === '1'" type="button"
        (click)="crear()">{{ 'proceso.comun.nuevo' | translate }}
        <i placement="top" [ngbTooltip]="'proceso.comun.nuevo' | translate" class="icofont icofont-plus"></i>
      </button>
    </div>
  </header>

  <section class="cfg-card">
    <div class="loader-box" *ngIf="cargando">
      <div class="loader-8"></div>
    </div>

    <div class="custom-datatable" *ngIf="!cargando">
      <div class="var-filtro">
        <input type='text' class="filter-ngx form-control"
          [placeholder]="'proceso.variables.filtrar' | translate" (keyup)='updateFilter($event)' />
      </div>
      <div class="datatable-scroll">
        <ngx-datatable #table class='material' [columns]="columns" [columnMode]="ColumnMode.force"
          [headerHeight]="30" [footerHeight]="50" rowHeight="auto" [limit]="10" [rows]="rows"
          [sorts]="[{ prop: 'nit', dir: 'asc' }]">
          <ngx-datatable-column [name]="'proceso.tabla.id' | translate" *ngIf="!isMobile" class="datatable-header">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.id }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column [name]="'proceso.variables.tituloCol' | translate">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.titulo }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column [name]="'proceso.variables.variable' | translate">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.variable }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column [name]="'proceso.variables.valor' | translate">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.valor }}
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>
      <div class="var-pie">
        <button class="cfg-btn cfg-btn--sec"><i class="icofont icofont-file-excel"></i>{{ 'proceso.comun.excel' | translate }}</button>
      </div>
    </div>
  </section>
</div>
