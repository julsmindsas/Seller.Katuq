<div class="cfg-pagina">
    <header class="cfg-cabeza">
        <div class="cfg-cabeza__textos">
            <span class="cfg-eyebrow">{{ 'proceso.comun.configuracion' | translate }}</span>
            <h1 class="cfg-titulo">{{ 'proceso.variables.crear' | translate }}</h1>
        </div>
    </header>

    <section class="cfg-card">
        <form class="cfg-form" [formGroup]="variableForm">
            <div class="cfg-form__grupo">
                <div>
                    <label for="id">{{ 'proceso.tabla.id' | translate }}</label>
                    <input class="form-control" type="text" id="id" formControlName="id">
                </div>
                <div>
                    <label for="image">{{ 'proceso.variables.tituloCol' | translate }}</label>
                    <input class="form-control" type="text" id="image" formControlName="titulo">
                </div>
                <div>
                    <label for="name">{{ 'proceso.variables.variable' | translate }}</label>
                    <input class="form-control" type="text" id="name" formControlName="variable">
                </div>
                <div>
                    <label for="position">{{ 'proceso.variables.valor' | translate }}</label>
                    <input class="form-control" type="text" id="position" formControlName="valor">
                </div>
            </div>

            <div class="cfg-form__pie">
                <button (click)="guardar()" class="cfg-btn" type="submit">{{ 'proceso.crearVariables.crear' | translate }}</button>
            </div>
        </form>
    </section>
</div>
