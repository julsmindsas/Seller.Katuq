<div class="cfg-pagina">
    <header class="cfg-cabeza">
        <div class="cfg-cabeza__textos">
            <span class="cfg-eyebrow">Configuración</span>
            <h1 class="cfg-titulo">Crear Variables</h1>
        </div>
    </header>

    <section class="cfg-card">
        <form class="cfg-form" [formGroup]="variableForm">
            <div class="cfg-form__grupo">
                <div>
                    <label for="id">ID</label>
                    <input class="form-control" type="text" id="id" formControlName="id">
                </div>
                <div>
                    <label for="image">Título</label>
                    <input class="form-control" type="text" id="image" formControlName="titulo">
                </div>
                <div>
                    <label for="name">Variable</label>
                    <input class="form-control" type="text" id="name" formControlName="variable">
                </div>
                <div>
                    <label for="position">Valor</label>
                    <input class="form-control" type="text" id="position" formControlName="valor">
                </div>
            </div>

            <div class="cfg-form__pie">
                <button (click)="guardar()" class="cfg-btn" type="submit">Crear Género</button>
            </div>
        </form>
    </section>
</div>
