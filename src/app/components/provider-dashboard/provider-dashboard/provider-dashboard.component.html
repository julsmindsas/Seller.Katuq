<div class="cfg-pagina provider-dashboard">
  <ng-container *ngIf="!unknownProvider; else providerNotFound">
    <header class="cfg-cabeza dashboard-header">
      <div class="cfg-cabeza__textos header-text">
        <span class="cfg-eyebrow">Integraciones</span>
        <h1 class="cfg-titulo">
          <i class="pi" [ngClass]="'pi-' + (config?.icon || 'box')"></i>
          {{ config?.label }}
        </h1>
        <p class="cfg-sub muted">{{ config?.description }}</p>
      </div>
      <div class="cfg-acciones header-actions">
        <a routerLink="/flows" class="cfg-btn cfg-btn--sec btn-link" pTooltip="Ver flujos automatizados" tooltipPosition="bottom">
          <i class="pi pi-sitemap"></i> Flujos
        </a>
        <a routerLink="/integrations" class="cfg-btn cfg-btn--sec btn-link" pTooltip="Volver a integraciones" tooltipPosition="bottom">
          <i class="pi pi-cog"></i> Credenciales
        </a>
      </div>
    </header>

    <section class="cfg-card tabs-card">
    <p-tabView [(activeIndex)]="activeTab" styleClass="provider-tabs">
      <p-tabPanel
        *ngIf="hasFeature('issues')"
        header="Pedidos con problemas"
        leftIcon="pi pi-exclamation-triangle">
        <app-provider-issues-table [provider]="provider!"></app-provider-issues-table>
      </p-tabPanel>

      <p-tabPanel
        *ngIf="hasFeature('kpis')"
        header="Resumen"
        leftIcon="pi pi-chart-bar">
        <app-provider-summary [provider]="provider!"></app-provider-summary>
      </p-tabPanel>

      <p-tabPanel
        *ngIf="hasFeature('products')"
        header="Productos"
        leftIcon="pi pi-box">
        <p class="placeholder">Estado de sincronización de productos próximamente.</p>
      </p-tabPanel>
    </p-tabView>
    </section>
  </ng-container>

  <ng-template #providerNotFound>
    <div class="cfg-card cfg-vacio not-found">
      <i class="pi pi-info-circle cfg-vacio__icono"></i>
      <h2 class="cfg-vacio__titulo">Integración no encontrada</h2>
      <p class="cfg-vacio__texto">El proveedor <strong>{{ provider }}</strong> no está configurado en este comercio o no existe en el sistema.</p>
      <button pButton type="button" label="Volver a integraciones" icon="pi pi-arrow-left" (click)="goBackToIntegrations()"></button>
    </div>
  </ng-template>
</div>
