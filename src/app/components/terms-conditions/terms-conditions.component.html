<app-publica-marco ancho="lectura">
  <div class="pub-stack">
    <span class="pub-eyebrow">{{ 'publica.terms.eyebrow' | translate }}</span>
    <h1 class="pub-h1">{{ 'publica.terms.title' | translate }}</h1>
    <p class="pub-lead">{{ 'publica.terms.lead' | translate }}</p>

    <a class="pub-btn pub-btn--sec" [href]="pdfUrl" download>{{ 'publica.terms.download' | translate }}</a>

    <object class="ter-visor" [data]="safePdfUrl" type="application/pdf" [attr.aria-label]="'publica.terms.viewerLabel' | translate">
      <p class="pub-help">{{ 'publica.terms.noViewer' | translate }} <a class="pub-link" [href]="pdfUrl" target="_blank" rel="noopener">{{ 'publica.terms.openTab' | translate }}</a> {{ 'publica.terms.orDownload' | translate }}</p>
    </object>
  </div>
</app-publica-marco>
