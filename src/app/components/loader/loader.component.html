<div *ngIf="isLoading$ | async" class="overlay" [@loaderAnimation] role="status" aria-live="assertive" aria-busy="true">
    <!-- "Cadena de suministro": camión viaja entre proveedor, bodega y cliente,
         encendiendo cada nodo al pasar. Íconos Font Awesome 4.7 (ya cargados
         globalmente), sin assets externos. -->
    <div class="route-loader">
        <div class="route-track"></div>

        <div class="route-node route-node--1">
            <i class="fa fa-industry"></i>
        </div>
        <div class="route-node route-node--2">
            <i class="fa fa-cubes"></i>
        </div>
        <div class="route-node route-node--3">
            <i class="fa fa-home"></i>
        </div>

        <i class="fa fa-truck route-truck"></i>

        <span class="sr-only">Cargando...</span>
    </div>
</div>
