<div class="thread-list">
  <header class="thread-list__header">
    <div class="thread-list__search-row">
      <div class="thread-list__search-wrapper">
        <i class="fa fa-search" aria-hidden="true"></i>
        <input
          type="search"
          class="thread-list__search"
          [placeholder]="'notificaciones.whatsapp.list.searchPlaceholder' | translate"
          [ngModel]="searchQuery"
          (ngModelChange)="onSearchChange($event)"
        />
      </div>
      <button
        type="button"
        class="thread-list__new-btn"
        (click)="openNewConversation()"
        [title]="'notificaciones.whatsapp.list.newConversation' | translate"
        [attr.aria-label]="'notificaciones.whatsapp.list.newConversation' | translate"
      >
        +
      </button>
    </div>

    <!-- [D-437] Filtro por número del comercio (solo si hay números conectados) -->
    <label class="thread-list__linea" *ngIf="opcionesLinea.length > 0">
      <span class="thread-list__linea-label">{{ 'notificaciones.whatsapp.list.line' | translate }}</span>
      <select
        class="thread-list__linea-select"
        [ngModel]="lineaFiltro"
        (ngModelChange)="onLineaFiltroChange($event)"
        [attr.aria-label]="'notificaciones.whatsapp.list.lineFilterAria' | translate"
      >
        <option value="">{{ 'notificaciones.whatsapp.list.allLines' | translate }}</option>
        <option *ngFor="let l of opcionesLinea" [value]="l.id">
          {{ l.displayName || l.displayPhone }}{{ l.displayName ? " · " + l.displayPhone : "" }}
        </option>
      </select>
    </label>

    <div class="thread-list__chips">
      <button
        type="button"
        class="thread-list__chip"
        [class.is-active]="filtro === 'pendientes'"
        (click)="setFiltro('pendientes')"
      >
        {{ 'notificaciones.whatsapp.list.unanswered' | translate }}
        <span class="thread-list__chip-count" *ngIf="pendientesCount > 0">{{ pendientesCount }}</span>
      </button>
      <button
        type="button"
        class="thread-list__chip"
        [class.is-active]="filtro === 'todas'"
        (click)="setFiltro('todas')"
      >
        {{ 'notificaciones.whatsapp.list.all' | translate }}
      </button>
      <button
        type="button"
        class="thread-list__chip"
        [class.is-active]="filtro === 'bot'"
        (click)="setFiltro('bot')"
      >
        {{ 'notificaciones.whatsapp.list.byBot' | translate }}
      </button>
    </div>
  </header>

  <div
    *ngIf="hasTruncatedThreads"
    class="thread-list__banner"
    role="status"
  >
    {{ 'notificaciones.whatsapp.list.truncatedBanner' | translate }}
  </div>

  <div class="thread-list__body">
    <div *ngIf="loading" class="thread-list__state">{{ 'notificaciones.whatsapp.list.loading' | translate }}</div>

    <div *ngIf="!loading && errorCarga" class="thread-list__state thread-list__state--error" role="alert">
      <span class="thread-list__state-texto">{{ 'notificaciones.whatsapp.list.loadError' | translate }}</span>
      <button type="button" class="thread-list__retry" (click)="fetchThreads()">{{ 'notificaciones.whatsapp.list.retry' | translate }}</button>
    </div>

    <div
      *ngIf="!loading && !errorCarga && visibleThreads.length === 0"
      class="thread-list__state"
    >
      {{ 'notificaciones.whatsapp.list.emptyFilter' | translate }}
    </div>

    <button
      type="button"
      *ngFor="let thread of visibleThreads; trackBy: trackByHash"
      class="thread-list__item"
      [class.is-active]="isSelected(thread)"
      [class.is-unread]="thread.unreadCount > 0"
      (click)="onSelect(thread)"
    >
      <div class="thread-list__avatar" aria-hidden="true">
        {{ initialsFor(thread.contactName) }}
      </div>

      <div class="thread-list__content">
        <div class="thread-list__row-top">
          <span class="thread-list__name">{{ thread.contactName }}</span>
          <span class="thread-list__date">
            {{ formatRelative(thread.lastMessageAt) }}
          </span>
        </div>

        <div class="thread-list__row-phone">
          <span class="thread-list__phone">{{ thread.phoneMasked }}</span>
          <app-linea-chip [linea]="thread.line" [compacta]="true"></app-linea-chip>
          <span
            *ngIf="thread.flags?.inboundTruncatedAt90d"
            class="thread-list__badge thread-list__badge--warn"
            [title]="'notificaciones.whatsapp.list.truncatedBadgeTitle' | translate"
          >
            {{ 'notificaciones.whatsapp.list.truncatedBadge' | translate }}
          </span>
        </div>

        <div class="thread-list__row-bottom">
          <ng-container *ngIf="tagFor(thread) as tag">
            <span class="thread-list__tag" [attr.data-kind]="tag.kind">
              <i
                class="fa"
                [ngClass]="{
                  'fa-magic': tag.kind === 'bot',
                  'fa-shopping-bag': tag.kind === 'pedido',
                  'fa-comment': tag.kind === 'cliente'
                }"
                aria-hidden="true"
              ></i>
              {{ tag.label | translate }}
            </span>
          </ng-container>
          <span class="thread-list__snippet" *ngIf="!tagFor(thread)">
            {{ truncateSnippet(thread.lastMessageSnippet) }}
          </span>
          <span
            *ngIf="thread.unreadCount > 0"
            class="thread-list__badge thread-list__badge--unread"
          >
            {{ thread.unreadCount }}
          </span>
        </div>

        <div class="thread-list__row-preview" *ngIf="tagFor(thread) && thread.lastMessageSnippet">
          <span class="thread-list__snippet">{{ truncateSnippet(thread.lastMessageSnippet) }}</span>
        </div>
      </div>
    </button>
  </div>

  <app-whatsapp-new-conversation-dialog
    [visible]="newConversationOpen"
    (closed)="onNewConversationClosed()"
    (sent)="onNewConversationSent($event)"
  ></app-whatsapp-new-conversation-dialog>
</div>
