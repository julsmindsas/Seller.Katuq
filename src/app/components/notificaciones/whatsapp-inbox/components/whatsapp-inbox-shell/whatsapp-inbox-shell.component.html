<div
  class="wa-shell"
  [class.wa-shell--detail-open]="selectedPhoneHash"
>
  <header class="wa-shell__header">
    <div class="wa-shell__heading">
      <h2 class="wa-shell__title">{{ 'notificaciones.whatsapp.shell.title' | translate }}</h2>
      <p class="wa-shell__subtitle">
        {{ 'notificaciones.whatsapp.shell.subtitle' | translate }}
      </p>
    </div>

    <nav class="wa-shell__tabs" role="tablist" [attr.aria-label]="'notificaciones.whatsapp.shell.tabsAria' | translate">
      <button
        type="button"
        role="tab"
        class="wa-shell__tab"
        [class.is-active]="vista === 'conversaciones'"
        [attr.aria-selected]="vista === 'conversaciones'"
        (click)="setVista('conversaciones')"
      >
        <i class="fa fa-comments-o" aria-hidden="true"></i> {{ 'notificaciones.whatsapp.shell.tabConversations' | translate }}
      </button>
      <button
        type="button"
        role="tab"
        class="wa-shell__tab"
        [class.is-active]="vista === 'pedidos'"
        [attr.aria-selected]="vista === 'pedidos'"
        (click)="setVista('pedidos')"
      >
        <i class="fa fa-shopping-basket" aria-hidden="true"></i> {{ 'notificaciones.whatsapp.shell.tabOrders' | translate }}
      </button>
    </nav>

    <a
      class="wa-shell__campaign"
      routerLink="/marketing/campanas/whatsapp"
      [title]="'notificaciones.whatsapp.shell.campaignTitle' | translate"
    >
      <i class="fa fa-bullhorn" aria-hidden="true"></i> {{ 'notificaciones.whatsapp.shell.newCampaign' | translate }}
    </a>
  </header>

  <div class="wa-shell__body">
    <aside class="wa-shell__list">
      <app-whatsapp-thread-list
        *ngIf="vista === 'conversaciones'"
        [lineas]="lineas"
        [esAdministrador]="esAdministrador"
        [miEmail]="miEmail"
        [claveSeleccion]="claveSeleccion"
        (threadSelected)="onThreadSelected($event)"
        (seleccionRefrescada)="onSeleccionRefrescada($event)"
      ></app-whatsapp-thread-list>
      <app-whatsapp-pedidos-list
        *ngIf="vista === 'pedidos'"
        [selectedPhoneHash]="selectedPhoneHash"
        (sesionSelected)="onSesionSelected($event)"
      ></app-whatsapp-pedidos-list>
    </aside>

    <section class="wa-shell__detail">
      <app-whatsapp-thread-detail
        [phoneHash]="selectedPhoneHash"
        [lineId]="selectedLineId"
        [chat]="seleccion"
        [multiNumero]="multiNumero"
        [equipo]="equipo"
        [esAdministrador]="esAdministrador"
        [miEmail]="miEmail"
        (duenoCambiado)="onDuenoCambiado($event)"
        (backToList)="onBackToList()"
      ></app-whatsapp-thread-detail>
    </section>
  </div>
</div>
