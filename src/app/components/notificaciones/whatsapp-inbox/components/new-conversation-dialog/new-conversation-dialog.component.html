<div
  *ngIf="visible"
  class="ncd-backdrop"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
>
  <div class="ncd-dialog">
    <header class="ncd-header">
      <h3 class="ncd-title">{{ 'notificaciones.whatsapp.list.newConversation' | translate }}</h3>
      <button
        type="button"
        class="ncd-close"
        (click)="onCancel()"
        [attr.aria-label]="'comun.cerrar' | translate"
      >
        ×
      </button>
    </header>

    <div class="ncd-body">
      <p class="ncd-hint" [innerHTML]="'notificaciones.whatsapp.newConversation.hint' | translate"></p>

      <!-- Teléfono -->
      <label class="ncd-field">
        <span class="ncd-label">{{ 'notificaciones.whatsapp.newConversation.phone' | translate }}</span>
        <input
          type="tel"
          class="form-control ncd-input"
          [placeholder]="'notificaciones.whatsapp.newConversation.phonePlaceholder' | translate"
          [(ngModel)]="phone"
          [disabled]="sending"
          inputmode="numeric"
        />
        <span class="ncd-help">{{ 'notificaciones.whatsapp.newConversation.phoneHelp' | translate }}</span>
      </label>

      <!-- Templates -->
      <label class="ncd-field">
        <span class="ncd-label">{{ 'notificaciones.whatsapp.newConversation.template' | translate }}</span>
        <select
          class="form-select ncd-input"
          [(ngModel)]="selectedTemplateName"
          (ngModelChange)="onTemplateChange()"
          [disabled]="sending || loadingTemplates"
        >
          <option value="" disabled>
            {{ (loadingTemplates ? 'notificaciones.whatsapp.newConversation.loadingTemplates' : 'notificaciones.whatsapp.newConversation.selectTemplate') | translate }}
          </option>
          <option *ngFor="let t of templates" [value]="t.name">
            {{ t.titulo || t.name }}{{ t.descripcion ? " — " + t.descripcion : "" }}
          </option>
        </select>
        <span *ngIf="!loadingTemplates && templates.length === 0" class="ncd-help ncd-help--warn">
          {{ 'notificaciones.whatsapp.newConversation.noTemplates' | translate }}
        </span>
      </label>

      <!-- Variables -->
      <div *ngIf="selectedTemplate && selectedTemplate.variables.length > 0" class="ncd-variables">
        <div class="ncd-label">{{ 'notificaciones.whatsapp.newConversation.variables' | translate }}</div>
        <label
          *ngFor="let n of selectedTemplate.variables; let i = index"
          class="ncd-field ncd-field--var"
        >
          <span class="ncd-label-sm">{{ 'notificaciones.whatsapp.newConversation.variable' | translate }} {{ "{{" }}{{ n }}{{ "}}" }}</span>
          <input
            type="text"
            class="form-control ncd-input"
            [placeholder]="'notificaciones.whatsapp.newConversation.valueFor' | translate: { name: '{{' + n + '}}' }"
            [(ngModel)]="variableValues[i]"
            [disabled]="sending"
          />
        </label>
      </div>

      <!-- Preview -->
      <div *ngIf="selectedTemplate" class="ncd-preview">
        <div class="ncd-label">{{ 'notificaciones.whatsapp.newConversation.preview' | translate }}</div>
        <div class="ncd-preview-bubble">{{ previewText }}</div>
      </div>

      <!-- Mensajes -->
      <div *ngIf="errorMsg" class="ncd-msg ncd-msg--error">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="ncd-msg ncd-msg--success">{{ successMsg }}</div>
    </div>

    <footer class="ncd-footer">
      <button
        type="button"
        class="btn btn-light ncd-btn"
        (click)="onCancel()"
        [disabled]="sending"
      >
        {{ 'comun.cancelar' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-primary ncd-btn"
        (click)="onSend()"
        [disabled]="!canSend"
      >
        {{ (sending ? 'notificaciones.whatsapp.detail.sending' : 'notificaciones.whatsapp.detail.send') | translate }}
      </button>
    </footer>
  </div>
</div>
