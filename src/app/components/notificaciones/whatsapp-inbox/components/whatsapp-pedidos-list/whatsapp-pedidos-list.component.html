<div class="wa-pedidos">
  <!-- Filtros por estado -->
  <div class="wa-pedidos__filtros" role="tablist" [attr.aria-label]="'notificaciones.whatsapp.orders.filterAria' | translate">
    <button
      *ngFor="let f of [
        { id: 'todo', label: 'notificaciones.whatsapp.orders.filterAll' },
        { id: 'bot', label: 'notificaciones.whatsapp.orders.filterBot' },
        { id: 'humano', label: 'notificaciones.whatsapp.orders.filterAgent' },
        { id: 'cerrada', label: 'notificaciones.whatsapp.orders.filterClosed' }
      ]"
      type="button"
      class="wa-pedidos__filtro"
      role="tab"
      [class.is-active]="filtro === f.id"
      (click)="setFiltro($any(f.id))"
    >
      {{ f.label | translate }}
      <span class="wa-pedidos__filtro-count">{{ contar($any(f.id)) }}</span>
    </button>
  </div>

  <div class="wa-pedidos__loading" *ngIf="loading">
    <i class="fa fa-spinner fa-spin"></i> {{ 'notificaciones.whatsapp.orders.loading' | translate }}
  </div>

  <!-- Estado vacío -->
  <div class="wa-pedidos__empty" *ngIf="!loading && filtradas.length === 0">
    <i class="fa fa-shopping-basket" aria-hidden="true"></i>
    <p><strong>{{ 'notificaciones.whatsapp.orders.emptyTitle' | translate }}</strong></p>
    <p>
      {{ 'notificaciones.whatsapp.orders.emptyText' | translate }}
    </p>
  </div>

  <!-- Tarjetas de conversación-pedido -->
  <div class="wa-pedidos__lista" *ngIf="!loading && filtradas.length > 0">
    <button
      *ngFor="let s of filtradas; trackBy: trackSesion"
      type="button"
      class="wa-pedidos__card"
      [class.is-selected]="s.phoneHash === selectedPhoneHash"
      (click)="seleccionar(s)"
    >
      <div class="wa-pedidos__card-top">
        <span class="wa-pedidos__nombre">{{ s.contactName }}</span>
        <span class="wa-pedidos__hace">{{ haceCuanto(s.actualizadoAt) }}</span>
      </div>

      <div class="wa-pedidos__card-mid">
        <span
          class="wa-pedidos__estado"
          [attr.data-estado]="s.estado"
        >
          {{ estadoEtiqueta(s) | translate }}
        </span>
        <span class="wa-pedidos__telefono" *ngIf="s.phoneMasked">{{ s.phoneMasked }}</span>
      </div>

      <!-- Carrito -->
      <div class="wa-pedidos__carrito" *ngIf="s.carrito.length > 0">
        <span class="wa-pedidos__carrito-resumen">
          <i class="fa fa-shopping-cart" aria-hidden="true"></i>
          {{ 'notificaciones.whatsapp.orders.cartSummary' | translate: { count: s.carrito.length, total: (s.totalCarrito | currency: "COP" : "symbol-narrow" : "1.0-0") } }}
        </span>
        <span class="wa-pedidos__carrito-detalle">
          <ng-container *ngFor="let l of s.carrito.slice(0, 3); let last = last">
            {{ l.cantidad }}× {{ l.nombre }}<ng-container *ngIf="!last">, </ng-container>
          </ng-container>
          <ng-container *ngIf="s.carrito.length > 3">…</ng-container>
        </span>
      </div>

      <!-- Cotización creada -->
      <div class="wa-pedidos__cotizacion" *ngIf="s.cotizacionCreada?.numero">
        <i class="fa fa-file-text-o" aria-hidden="true"></i>
        {{ 'notificaciones.whatsapp.orders.quoteReady' | translate: { numero: s.cotizacionCreada?.numero } }}
      </div>

      <div class="wa-pedidos__motivo" *ngIf="s.estado === 'humano' && s.motivoTraspaso">
        {{ s.motivoTraspaso }}
      </div>
    </button>
  </div>
</div>
