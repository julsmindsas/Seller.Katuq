<!-- El campo de escribir no puede decir «lista abierta» (un textarea no admite aria-expanded): lo anuncia esta
     región, que siempre está en la página para que el lector de pantalla la oiga cambiar. -->
<span class="rq-anuncio" aria-live="polite">{{ abierta ? ('notificaciones.cierre.rapidosAbierta' | translate: { n: opciones.length }) : '' }}</span>
<ul class="rq-lista" *ngIf="abierta" role="listbox" [id]="idLista" [attr.aria-label]="'notificaciones.bandeja.rapidos.listaAria' | translate">
  <li
    class="rq-opcion"
    *ngFor="let o of opciones; let i = index; trackBy: trackOpcion"
    role="option"
    [id]="idDe(o)"
    [class.is-activa]="i === indice"
    [attr.aria-selected]="i === indice"
    (mousedown)="alPulsar($event, o)"
  >
    <span class="rq-opcion__comando">{{ o.comando }}</span>
    <span class="rq-opcion__texto">{{ o.texto }}</span>
  </li>
</ul>
