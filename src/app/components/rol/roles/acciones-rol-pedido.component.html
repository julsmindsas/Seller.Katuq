<!-- D-547 (F2): acciones principales del pedido de un rol. Clases con prefijo racc- (ninguna lleva «p-»). -->
<section class="racc-seccion" aria-labelledby="racc-titulo">
  <h3 id="racc-titulo" class="racc-titulo">Acciones principales del pedido</h3>
  <p class="racc-sub">
    Las 4 acciones que verán primero, en el bloque ACCIONES de cada pedido, quienes tengan este rol.
    No dan ni quitan permisos: si alguien no puede usar una, la verá bloqueada.
  </p>

  <div class="racc-fila" role="group" aria-label="Perfil de partida">
    <span class="racc-etiqueta">Perfil de partida</span>
    <div class="racc-perfiles">
      <button type="button" class="racc-perfil" *ngFor="let p of perfiles"
              [class.racc-perfil-activo]="p.id === estado.profile" [attr.aria-pressed]="p.id === estado.profile"
              (click)="elegirPerfil(p.id)">{{ p.titulo }}</button>
    </div>
    <span class="racc-nota" *ngIf="personalizado">Cambiaste alguna acción: parte del perfil {{ tituloPerfil }}.</span>
  </div>

  <div class="racc-listas">
    <div class="racc-campo" *ngFor="let accion of estado.actions; index as i">
      <label class="racc-etiqueta" [attr.for]="'racc-accion-' + i">Acción {{ i + 1 }}</label>
      <select class="form-control racc-select" [attr.id]="'racc-accion-' + i" (change)="cambiar(i, $any($event.target).value)">
        <option *ngFor="let o of opciones(i)" [value]="o.id" [selected]="o.id === accion">{{ o.titulo }}</option>
      </select>
    </div>
  </div>

  <div class="racc-pie">
    <button type="button" class="racc-guardar" [disabled]="guardando" (click)="guardar()">
      {{ guardando ? 'Guardando…' : 'Guardar acciones' }}
    </button>
    <span class="racc-nota" *ngIf="guardado" role="status">Guardado.</span>
  </div>
</section>
