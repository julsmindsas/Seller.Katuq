<div class="eiv-container">
  <p class="eiv-hint" *ngIf="!pedido">{{ 'ventas.editarIvaLineaPedido.sinPedido' | translate }}</p>

  <ng-container *ngIf="pedido">
    <p class="eiv-hint">{{ 'ventas.editarIvaLineaPedido.eligeLinea' | translate }}</p>

    <div class="eiv-lineas">
      <button
        type="button"
        class="eiv-linea"
        *ngFor="let linea of lineas; let i = index"
        [class.eiv-linea--activa]="lineaSeleccionadaIndex === i"
        (click)="seleccionarLinea(i)">
        <div class="eiv-linea__info">
          <span class="eiv-linea__titulo">{{ linea?.producto?.crearProducto?.titulo || ('ventas.editarIvaLineaPedido.sinNombre' | translate) }}</span>
          <span class="eiv-linea__ref">{{ 'ventas.editarIvaLineaPedido.refCant' | translate: { ref: linea?.producto?.identificacion?.referencia || ('ventas.editarIvaLineaPedido.na' | translate), cant: linea?.cantidad } }}</span>
        </div>
        <span class="eiv-chip">{{ 'ventas.editarIvaLineaPedido.ivaChip' | translate: { iva: ivaActualDeLinea(linea) } }}</span>
      </button>
    </div>

    <div class="eiv-edicion" *ngIf="lineaSeleccionadaIndex !== null">
      <label class="eiv-label">{{ 'ventas.editarIvaLineaPedido.nuevoIva' | translate }}</label>
      <select class="eiv-select" [(ngModel)]="nuevoIva">
        <option *ngFor="let iva of ivasPermitidos" [ngValue]="iva">{{ iva }}%</option>
      </select>
    </div>

    <div class="eiv-aviso" *ngIf="facturaPorRefacturar">
      {{ 'ventas.editarIvaLineaPedido.avisoRefacturar' | translate: { factura: facturaPorRefacturar, sistema: sistemaContable } }}
    </div>

    <div class="eiv-error" *ngIf="error">{{ error }}</div>

    <div class="eiv-acciones">
      <button type="button" class="eiv-btn eiv-btn--ghost" (click)="cancelar()" [disabled]="guardando">{{ 'comun.cancelar' | translate }}</button>
      <button type="button" class="eiv-btn eiv-btn--primary" (click)="guardar()" [disabled]="!puedeGuardar()">
        <i class="fa fa-spinner fa-spin me-1" *ngIf="guardando"></i>
        {{ 'ventas.editarIvaLineaPedido.guardarIva' | translate }}
      </button>
    </div>
  </ng-container>
</div>
