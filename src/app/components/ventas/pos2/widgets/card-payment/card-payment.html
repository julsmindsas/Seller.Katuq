<!--
  Métodos de pago electrónico (piel Katuq). Se conservan paymentCategories,
  selectPaymentMethod(), getCategoryIcon(), getPaymentIconPath() y onImgError().
-->
<div class="modal-header">
  <h4 class="modal-title">
    <span class="cd-chip">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
    </span>
    Métodos de pago electrónico
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <div class="payment-methods-container">
    <ng-container *ngIf="paymentCategories && paymentCategories.length; else sinFormasPago">

      <div class="payment-category" *ngFor="let cat of paymentCategories">
        <h5 class="cd-cat-title">
          <i [ngClass]="getCategoryIcon(cat.categoria)"></i>
          {{ cat.categoria }}
        </h5>

        <div class="payment-options-grid">
          <button type="button" class="payment-option" *ngFor="let metodo of cat.formasPago"
                  (click)="selectPaymentMethod(metodo.nombre)">
            <span class="payment-option-icon">
              <img [src]="getPaymentIconPath(metodo)" [alt]="metodo.nombre" (error)="onImgError($event)">
            </span>
            <span class="payment-option-name">{{ metodo.nombre }}</span>
          </button>
        </div>
      </div>

    </ng-container>

    <ng-template #sinFormasPago>
      <div class="cd-empty">
        <span class="cd-empty-ic">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
        </span>
        <span class="cd-empty-title">No hay métodos de pago configurados</span>
        <span class="cd-empty-sub">Configúralos en las formas de pago de la empresa para cobrarlos aquí.</span>
      </div>
    </ng-template>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
</div>
