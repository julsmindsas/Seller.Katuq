<!-- card-payment.component.html -->
<div class="modal-header">
  <h4 class="modal-title">Seleccione un Método de Pago Electrónico</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="payment-methods-container">
    <ng-container *ngIf="paymentCategories && paymentCategories.length; else sinFormasPago">
      <div class="payment-category" *ngFor="let cat of paymentCategories">
        <h5><i [ngClass]="getCategoryIcon(cat.categoria)"></i> {{ cat.categoria }}</h5>
        <div class="payment-options-grid">
          <div class="payment-option" *ngFor="let metodo of cat.formasPago" (click)="selectPaymentMethod(metodo.nombre)">
            <div class="payment-option-icon">
              <img [src]="getPaymentIconPath(metodo)" [alt]="metodo.nombre" (error)="onImgError($event)">
            </div>
            <div class="payment-option-name">{{ metodo.nombre }}</div>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-template #sinFormasPago>
      <p>No se encontraron métodos de pago disponibles.</p>
    </ng-template>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
</div>
