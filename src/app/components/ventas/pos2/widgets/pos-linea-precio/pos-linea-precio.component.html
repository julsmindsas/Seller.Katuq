<div class="lin-editor">
  <div class="lin-campos">
    <label class="lin-campo lin-base">
      <span class="lin-label">{{ 'ventas.posLineaPrecio.base' | translate }}</span>
      <input *ngIf="permiteManual; else baseFija" class="lin-input" type="number" min="0" step="100"
             [ngModel]="precioBase"
             (ngModelChange)="onPrecioInput($event)"
             (blur)="onPrecioConfirm()"
             (keyup.enter)="onPrecioConfirm()"
             [attr.aria-label]="'ventas.posLineaPrecio.precioBaseSinIva' | translate">
      <ng-template #baseFija>
        <span class="lin-fijo">{{ resuelta.sinIva | currency:'USD':'symbol':'1.0-0' }}</span>
      </ng-template>
    </label>
    <label class="lin-campo lin-iva">
      <span class="lin-label">{{ 'ventas.posLineaPrecio.iva' | translate }}</span>
      <select class="lin-input" [ngModel]="ivaActual" (ngModelChange)="onIvaChange($event)" [attr.aria-label]="'ventas.posLineaPrecio.ivaDeLaLinea' | translate">
        <option *ngFor="let t of tarifas" [ngValue]="t">{{ t }}%</option>
      </select>
    </label>
    <label class="lin-campo lin-desc">
      <span class="lin-label">{{ 'ventas.posLineaPrecio.descPorcentaje' | translate }}</span>
      <input class="lin-input" type="number" min="0" max="100" step="1"
             [ngModel]="descActual"
             (ngModelChange)="onDescChange($event)"
             [attr.aria-label]="'ventas.posLineaPrecio.descuentoDeLaLinea' | translate">
    </label>
  </div>
  <div class="lin-desglose">
    <span class="lin-texto">{{ 'ventas.posLineaPrecio.desglose' | translate: { iva: (resuelta.ivaUnitarioNeto | currency:'USD':'symbol':'1.0-0'), total: (resuelta.conIvaUnitarioNeto | currency:'USD':'symbol':'1.0-0') } }}</span>
    <button *ngIf="editada" type="button" class="lin-restaurar" (click)="restaurar()">{{ 'ventas.posLineaPrecio.restaurar' | translate }}</button>
  </div>
</div>
