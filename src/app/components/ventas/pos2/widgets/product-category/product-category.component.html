<!--
  Franja de categorías del POS (mockup "Ventas POS").
  Antes era un carrusel con autoplay dentro de una tarjeta: robaba altura al
  catálogo y se movía solo mientras el cajero buscaba. Ahora es una tira de
  chips con scroll horizontal. La lista sigue siendo la misma (imagesRect).
-->
<div class="cat-strip">
  <span class="cat-strip-label">{{ 'Categorías' | translate }}</span>

  <div class="cat-strip-rail">
    <div class="cat-chip" *ngFor="let item of imagesRect" [title]="item.title">
      <img [src]="item.image" class="cat-chip-img" alt="Categoría">
      <span class="cat-chip-title">{{ item.title }}</span>
    </div>
  </div>

  <a class="cat-strip-all" [routerLink]="['/categorias']">{{ 'Ver todas' | translate }}</a>
</div>
