<div class="modal-header">
    <h5 class="modal-title" id="modaldashboard">{{ 'ventas.createCustomerModal.titulo' | translate }}</h5>
    <button class="btn-close" type="button" (click)="closeModal()"></button>
  </div>
  <div class="modal-body p-0">
    <div class="text-start dark-sign-up">
      <div class="modal-body">
        <form class="row g-3 needs-validation" novalidate="">
          <div class="col-md-6">
            <label class="form-label" for="validationCustom-8">{{ 'ventas.createCustomerModal.nombre' | translate }}<span class="txt-danger">*</span></label>
            <input class="form-control" id="validationCustom-8" type="text" [placeholder]="'ventas.createCustomerModal.ingreseNombre' | translate" required="">
            <div class="valid-feedback">{{ 'ventas.createCustomerModal.seVeBien' | translate }}</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="validationCustom09">{{ 'ventas.createCustomerModal.apellido' | translate }}<span class="txt-danger">*</span></label>
            <input class="form-control" id="validationCustom09" type="text" [placeholder]="'ventas.createCustomerModal.ingreseApellido' | translate" required="">
            <div class="valid-feedback">{{ 'ventas.createCustomerModal.seVeBien' | translate }}</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="validationCustom08">{{ 'ventas.createCustomerModal.celular' | translate }}<span class="txt-danger">*</span></label>
            <input class="form-control" id="validationCustom08" type="number" [placeholder]="'ventas.createCustomerModal.numeroCelular' | translate" required="">
            <div class="valid-feedback">{{ 'ventas.createCustomerModal.seVeBien' | translate }}</div>
          </div>
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label" for="exampleFormControlInput8">{{ 'ventas.createCustomerModal.correo' | translate }}<span class="txt-danger">*</span></label>
              <input class="form-control" id="exampleFormControlInput8" type="email" [placeholder]="'ventas.createCustomerModal.correoEjemplo' | translate">
            </div>
          </div>
          <div class="col-md-12 d-flex justify-content-end">
            <button class="btn btn-primary" type="button" (click)="closeModal()">{{ 'ventas.createCustomerModal.crear' | translate }}</button>
          </div>
        </form>
      </div>
    </div>
</div>
