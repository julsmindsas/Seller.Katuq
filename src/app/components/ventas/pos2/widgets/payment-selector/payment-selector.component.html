<div class="card payment-methods-sticky">
  <div class="tarjeta-cabeza card-no-border p-3">
    <div class="header-top">
      <!-- Elegir el método ABRE el flujo de cobro (openPaymentFlow), así que el
           título dice lo que realmente pasa al hacer clic. -->
      <h5 class="m-0">{{ 'ventas.paymentSelector.cobrarCon' | translate }}</h5>
    </div>
  </div>
  <div class="card-body pt-0 order-details p-3">
    <div class="payment-options">
      <div class="icons" role="group" [attr.aria-label]="'ventas.paymentSelector.cobrarCon' | translate">
        <button (click)="handleCashPayment()" class="icon" [class.selected]="selectedMethod === 'Efectivo'">
          <img src="assets/images/dashboard-8/payment-option/cash.svg" [alt]="'ventas.paymentSelector.efectivo' | translate" />
          <span>{{ 'ventas.paymentSelector.efectivo' | translate }}</span>
        </button>
        
        <button (click)="handleCardPayment()" class="icon" [class.selected]="selectedMethod === 'Métodos Electrónicos'">
          <img src="assets/images/dashboard-8/payment-option/card.svg" [alt]="'ventas.paymentSelector.metodosElectronicos' | translate" />
          <span>{{ 'ventas.paymentSelector.metodosElectronicos' | translate }}</span>
        </button>
        
        <button (click)="handleEWalletPayment()" class="icon" [class.selected]="selectedMethod === 'E-Wallet'">
          <img src="assets/images/dashboard-8/payment-option/wallet.svg" [alt]="'ventas.paymentSelector.eWallet' | translate" />
          <span>{{ 'ventas.paymentSelector.eWallet' | translate }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
