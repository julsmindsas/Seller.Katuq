<div class="modal">
    <div class="modal-content">
      <h2>{{ title }}</h2>
      <ng-container *ngIf="paymentType === 'Efectivo'">
        <p>{{ 'ventas.paymentModal.ingreseCantidadRecibida' | translate }}</p>
        <input type="number" [(ngModel)]="amountReceived" [placeholder]="'ventas.paymentModal.montoRecibido' | translate" />
        <p>{{ 'ventas.paymentModal.cambio' | translate: { monto: calculateChange() } }}</p>
      </ng-container>
      <ng-container *ngIf="paymentType === 'Tarjeta'">
        <p>{{ 'ventas.paymentModal.ingreseNumeroAutorizacion' | translate }}</p>
        <input type="text" [(ngModel)]="authorizationCode" [placeholder]="'ventas.paymentModal.codigoAutorizacion' | translate" />
      </ng-container>
      <ng-container *ngIf="paymentType === 'E-Wallet'">
        <p>{{ 'ventas.paymentModal.escaneeIdBilletera' | translate }}</p>
        <input type="text" [(ngModel)]="walletId" [placeholder]="'ventas.paymentModal.idBilletera' | translate" />
      </ng-container>
      <button (click)="onPay()">{{ 'ventas.paymentModal.pagar' | translate }}</button>
      <button (click)="closeModal()">{{ 'comun.cancelar' | translate }}</button>
    </div>
  </div>
