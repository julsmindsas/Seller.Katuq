<!-- warehouse-selector.component.html -->
<div class="warehouse-selector">
  <div class="selector-row">
    <span class="ws-ic">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
    </span>

    <h3 class="warehouse-title">Bodega</h3>

    <div class="select-container">
      <select #ware class="form-control" id="bodegaSelect" (change)="onWarehouseChange($event)">
        <option value="">{{ "Seleccione una bodega" }}</option>
        <option *ngFor="let bodega of bodegas" [value]="bodega.id">
          {{ bodega.nombre }} ({{ bodega.idBodega }})
        </option>
      </select>
    </div>

    <div *ngIf="selectedWarehouse" class="selected-warehouse" [title]="selectedWarehouse">
      <i class="fa fa-check-circle"></i>
      <span>{{ selectedWarehouse }}</span>
    </div>
  </div>
</div>
