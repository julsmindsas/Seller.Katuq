<div class="modal-header">
  <h5 class="modal-title"><i class="fa fa-file-text-o me-2"></i>{{ 'Facturación de la venta' | translate }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cerrar()"></button>
</div>

<div class="modal-body">
  <p class="pf-ayuda">{{ '¿A quién se le factura esta venta? La factura electrónica se genera sola al terminar el cobro.' | translate }}</p>

  <div class="pf-opciones" role="radiogroup">
    <!-- Perfiles del cliente -->
    <label *ngFor="let p of perfiles; let i = index" class="pf-opcion" [class.pf-activa]="seleccion === i"
           [class.pf-incompleta]="faltantes(p).length">
      <input type="radio" name="facturacionPos" [value]="i" [(ngModel)]="seleccion">
      <div class="pf-texto">
        <div class="pf-titulo">
          {{ p.alias || p.nombres }}
          <span *ngIf="p.predeterminado" class="pf-badge">{{ 'Predeterminado' | translate }}</span>
        </div>
        <div class="pf-detalle">{{ p.nombres }} · {{ p.tipoDocumento }} {{ p.documento }}</div>
        <div *ngIf="faltantes(p).length" class="pf-falta">
          <i class="fa fa-exclamation-triangle me-1"></i>{{ 'Le falta' | translate }}: {{ faltantes(p).join(', ') }}
        </div>
      </div>
    </label>

    <div *ngIf="!perfiles.length" class="pf-vacio">
      {{ 'Este cliente no tiene datos de facturación guardados.' | translate }}
    </div>

    <!-- Consumidor Final -->
    <label class="pf-opcion" [class.pf-activa]="seleccion === -1">
      <input type="radio" name="facturacionPos" [value]="-1" [(ngModel)]="seleccion">
      <div class="pf-texto">
        <div class="pf-titulo">{{ 'Consumidor Final' | translate }}</div>
        <div class="pf-detalle">{{ 'Factura sin datos del comprador (CC 222222222222)' | translate }}</div>
      </div>
    </label>

    <!-- No requiere factura -->
    <label class="pf-opcion" [class.pf-activa]="seleccion === -2">
      <input type="radio" name="facturacionPos" [value]="-2" [(ngModel)]="seleccion">
      <div class="pf-texto">
        <div class="pf-titulo">{{ 'No requiere factura' | translate }}</div>
        <div class="pf-detalle">{{ 'Se puede facturar después desde Pedidos' | translate }}</div>
      </div>
    </label>
  </div>

  <button type="button" class="btn btn-link pf-editar" (click)="editarCliente()">
    <i class="fa fa-pencil me-1"></i>{{ 'Agregar o corregir datos de facturación del cliente' | translate }}
  </button>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="cerrar()">{{ 'Cancelar' | translate }}</button>
  <button type="button" class="btn pf-confirmar" [disabled]="!puedeConfirmar" (click)="confirmar()">
    {{ 'Usar esta opción' | translate }}
  </button>
</div>
