<!--
  POS · marco de pantalla completa (mockup "Ventas POS").
  Solo presentación: cada componente hijo conserva su selector y sus bindings
  originales. La barra superior agrupa bodega + acciones; el cuerpo es catálogo
  a la izquierda y ticket fijo a la derecha.
-->
<div class="pos-shell">

    <!-- ===================== BARRA SUPERIOR ===================== -->
    <header class="pos-topbar">

        <div class="pos-brand">
            <span class="pos-brand-ic">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </span>
            <div class="pos-brand-text">
                <div class="pos-brand-title">Ventas POS</div>
                <div class="pos-brand-sub">Punto de venta</div>
            </div>
        </div>

        <div class="pos-bodega">
            <app-warehouse-selector (warehouseChange)="onWarehouseChanged()"></app-warehouse-selector>
        </div>

        <div class="action-buttons">
            <button class="btn btn-info history-btn" (click)="openCashClosingHistoryModal()">
                <i class="fa fa-history"></i> Historial
            </button>
            <button class="btn pedidos-btn" type="button" (click)="irAPedidos()" title="Ver pedidos">
                <i class="fa fa-list-alt"></i> Pedidos
            </button>
            <button class="btn btn-primary cash-closing-btn" (click)="openCashClosingModal()">
                <i class="fa fa-money"></i> Cierre de Caja
            </button>
            <!-- Calculadora -->
            <div class="calc-wrapper">
                <button class="calc-fab" type="button" (click)="toggleCalculadora()"
                    [class.calc-fab--active]="calcVisible" title="Calculadora">
                    <i class="fa" [ngClass]="calcVisible ? 'fa-times' : 'fa-calculator'"></i>
                </button>
                <div class="calc-panel" [class.calc-panel--open]="calcVisible">
                    <div class="calc-header">
                        <span class="calc-title"><i class="fa fa-calculator me-2"></i>Calculadora</span>
                        <button class="calc-close" type="button" (click)="toggleCalculadora()"><i class="fa fa-times"></i></button>
                    </div>
                    <div class="calc-display">
                        <div class="calc-expression">{{ calcExpresion || '&nbsp;' }}</div>
                        <div class="calc-current">{{ calcDisplay }}</div>
                    </div>
                    <div class="calc-buttons">
                        <button class="calc-btn calc-btn--fn" type="button" (click)="calcLimpiar()">C</button>
                        <button class="calc-btn calc-btn--fn" type="button" (click)="calcBorrar()"><i class="fa fa-backspace"></i></button>
                        <button class="calc-btn calc-btn--fn" type="button" (click)="calcPorcentaje()">%</button>
                        <button class="calc-btn calc-btn--op" type="button" (click)="calcOperar('÷')">÷</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('7')">7</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('8')">8</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('9')">9</button>
                        <button class="calc-btn calc-btn--op" type="button" (click)="calcOperar('×')">×</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('4')">4</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('5')">5</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('6')">6</button>
                        <button class="calc-btn calc-btn--op" type="button" (click)="calcOperar('−')">−</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('1')">1</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('2')">2</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('3')">3</button>
                        <button class="calc-btn calc-btn--op" type="button" (click)="calcOperar('+')">+</button>
                        <button class="calc-btn calc-btn--zero" type="button" (click)="calcPresionar('0')">0</button>
                        <button class="calc-btn" type="button" (click)="calcPresionar('.')">.</button>
                        <button class="calc-btn calc-btn--eq" type="button" (click)="calcIgual()">=</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===================== CUERPO ===================== -->
    <div class="pos-body">

        <!-- Catálogo -->
        <section class="pos-main">
            <app-product-category></app-product-category>
            <app-product></app-product>
        </section>

        <!-- Ticket: cliente + carrito + pago.
             En móvil se comporta como hoja: oculto hasta que se pulsa "Ticket"
             en la barra inferior. En escritorio es la columna de siempre. -->
        <aside class="pos-ticket" [class.is-open]="ticketAbierto">

            <!-- Encabezado de la hoja (solo móvil) -->
            <div class="pos-sheet-head">
                <button type="button" class="pos-sheet-back" (click)="cerrarTicket()" aria-label="Volver al catálogo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <span class="pos-sheet-title">Ticket</span>
                <span class="pos-sheet-count">{{ itemsEnTicket }} {{ itemsEnTicket === 1 ? 'ítem' : 'ítems' }}</span>
            </div>

            <app-pos-checkout></app-pos-checkout>
        </aside>
    </div>

    <!-- Velo del ticket en móvil -->
    <div class="pos-sheet-veil" *ngIf="ticketAbierto" (click)="cerrarTicket()"></div>

    <!-- Barra inferior (solo móvil): el total siempre a la vista y el ticket
         a un toque de distancia. -->
    <div class="pos-mobilebar">
        <div class="pos-mobilebar-total">
            <span class="pos-mobilebar-label">{{ itemsEnTicket }} {{ itemsEnTicket === 1 ? 'ítem' : 'ítems' }}</span>
            <span class="pos-mobilebar-amount">${{ totalTicket | number: '1.0-0' }}</span>
        </div>
        <button type="button" class="pos-mobilebar-btn" (click)="abrirTicket()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            Ver ticket
        </button>
        <button type="button" class="pos-mobilebar-btn pos-mobilebar-btn--pay" (click)="abrirTicket()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Cobrar
        </button>
    </div>
</div>
