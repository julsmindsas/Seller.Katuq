<div class="modal-header">
  <h4 class="modal-title">{{ 'Vista previa de impresión' | translate }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>

<div class="modal-body">
  <div class="pdf-container">
    <!-- Loading State -->
    <div *ngIf="isLoadingContent" class="text-center p-4">
      <div class="spinner-border text-primary mb-3" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <h6>{{ 'Cargando contenido...' | translate }}</h6>
      <p class="text-muted">{{ 'Por favor espere mientras se cargan los datos maestros' | translate }}</p>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError && !isLoadingContent" class="alert alert-warning text-center p-4">
      <h6>⚠️ {{ 'Error cargando contenido' | translate }}</h6>
      <p>{{ errorMessage }}</p>
      <button class="btn btn-outline-primary btn-sm mt-2" (click)="retryLoadContent()">
        <i class="pi pi-refresh me-1"></i>{{ 'Reintentar' | translate }}
      </button>
    </div>

    <!-- Content -->
    <div *ngIf="!isLoadingContent && !hasError" #vistaPrevia class="pdf-preview" id="htmlPdf" [innerHTML]="safeHtmlContent"></div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="closeModal()">
    {{ 'Cerrar' | translate }}
  </button>
  <button
    type="button"
    class="btn btn-outline-primary"
    [disabled]="ocupado"
    (click)="descargarPdf()">
    <div *ngIf="isGeneratingPDF" class="spinner-border spinner-border-sm me-2" role="status"></div>
    <i *ngIf="!isGeneratingPDF" class="pi pi-download me-1"></i>
    {{ (isGeneratingPDF ? 'Generando PDF...' : 'Descargar PDF') | translate }}
  </button>
  <button
    type="button"
    class="btn btn-primary"
    [disabled]="ocupado"
    (click)="imprimir()">
    <div *ngIf="isLoadingContent || isPrinting" class="spinner-border spinner-border-sm me-2" role="status"></div>
    <i *ngIf="!isLoadingContent && !isPrinting" class="pi pi-print me-1"></i>
    {{ (isLoadingContent ? 'Cargando...' : isPrinting ? 'Preparando...' : 'Imprimir') | translate }}
  </button>
</div>
