<div class="cz-modal">

  <!-- Cargando -->
  <div class="cz-estado" *ngIf="cargando">
    <i class="pi pi-spin pi-spinner"></i>
    <p>Consultando transportadoras de Guía Cereza...</p>
  </div>

  <!-- Error -->
  <div class="cz-estado cz-estado--error" *ngIf="!cargando && error">
    <div class="cz-estado__icono"><i class="pi pi-exclamation-triangle"></i></div>
    <p>{{ error }}</p>
    <button type="button" class="cz-btn cz-btn--ghost" (click)="reintentar()">
      <i class="pi pi-refresh"></i> Reintentar
    </button>
  </div>

  <!-- Listado -->
  <ng-container *ngIf="!cargando && !error">

    <div class="cz-encabezado">
      <div>
        <span class="cz-label">Despacho por Guía Cereza</span>
        <p class="cz-sub">
          La ciudad de entrega se toma del pedido. Solo elige con qué transportadora sale.
        </p>
      </div>
      <span class="cz-chip" *ngIf="cantidadPedidos > 0">
        {{ cantidadPedidos }} pedido{{ cantidadPedidos === 1 ? '' : 's' }}
      </span>
    </div>

    <div class="cz-buscador">
      <i class="pi pi-search"></i>
      <input
        type="text"
        [(ngModel)]="busqueda"
        (input)="filtrar()"
        placeholder="Buscar transportadora..."
        autocomplete="off" />
    </div>

    <div class="cz-lista">
      <button
        type="button"
        class="cz-item"
        *ngFor="let carrier of carriersFiltrados"
        [class.is-active]="seleccionada?.code === carrier.code"
        (click)="seleccionar(carrier)">
        <span class="cz-item__radio">
          <i class="pi" [ngClass]="seleccionada?.code === carrier.code ? 'pi-check-circle' : 'pi-circle'"></i>
        </span>
        <span class="cz-item__nombre">{{ carrier.name }}</span>
        <span class="cz-item__codigo">{{ carrier.code }}</span>
      </button>

      <p class="cz-vacio" *ngIf="carriersFiltrados.length === 0">
        Ninguna transportadora coincide con "{{ busqueda }}"
      </p>
    </div>

    <div class="cz-pie">
      <button type="button" class="cz-btn cz-btn--ghost" (click)="cancelar()">Cancelar</button>
      <button
        type="button"
        class="cz-btn cz-btn--primario"
        [disabled]="!seleccionada"
        (click)="confirmar()">
        <i class="pi pi-send"></i>
        Despachar{{ seleccionada ? ' con ' + seleccionada.name : '' }}
      </button>
    </div>

  </ng-container>
</div>
