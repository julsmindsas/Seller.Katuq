<div class="eve-stage" #stage>
  <canvas
    #canvas
    class="eve-canvas"
    [hidden]="sin3d"
    role="img"
    [attr.aria-label]="etiquetaAria"
  ></canvas>
  <div #etiquetas class="eve-labels" aria-hidden="true"></div>
  <app-en-vivo-orbe-boton *ngIf="!sin3d"></app-en-vivo-orbe-boton>
  <div
    class="eve-leyenda"
    *ngIf="coloresLeyenda.length && !sin3d"
    role="img"
    [attr.aria-label]="'enVivo.enVivoEscenaComun.leyendaMientrasMasOscuroEl' | translate"
  >
    <span aria-hidden="true">{{ 'enVivo.enVivoEscenaComun.pedidosPorDepartamento' | translate }}</span>
    <i class="eve-ley-tierra" aria-hidden="true"></i>
    <i *ngFor="let c of coloresLeyenda" [style.background]="c" aria-hidden="true"></i>
    <span aria-hidden="true">{{ 'enVivo.enVivoEscenaComun.mas' | translate }}</span>
  </div>
  <div class="eve-nogl" *ngIf="sin3d" role="status">
    <div><b>{{ 'enVivo.enVivoEscenaComun.esteEquipoNoMuestraLa' | translate }}</b> {{ 'enVivo.enVivoEscenaComun.lasCifrasLasEtapasY' | translate }}</div>
  </div>
</div>
