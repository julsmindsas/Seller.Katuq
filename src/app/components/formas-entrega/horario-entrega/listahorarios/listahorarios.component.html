<div class="cfg-pagina">
  <header class="cfg-cabeza">
    <div class="cfg-cabeza__textos">
      <span class="cfg-eyebrow">Configuración</span>
      <h1 class="cfg-titulo">Horario Entrega</h1>
    </div>
  </header>

  <section class="cfg-card">
        <div class="loader-box" *ngIf="cargando">
          <div class="loader-8"></div>
        </div>

        <div class="custom-datatable" *ngIf="!cargando">
          <div class="row lh-barra">
            <div class="col-sm-6">
              <input type='text' class="filter-ngx form-control mb-3 lh-filtro"
                placeholder="{{'Escribe texto que deseas filtrar' | translate}}" (keyup)='updateFilter($event)' />
            </div>
            <div class="col-sm-6 mb-3 lh-acciones">

              <button class="cfg-btn" type="button" (click)="create()">
                <span>{{'Crear horario de entrega' | translate}}</span>
                <i placement="top" ngbTooltip="{{'Nuevo' | translate}}"
                  class="icofont icofont-plus"></i>
              </button>
            </div>

          </div>
          <div class="col-12 lh-tabla">
            <ngx-datatable #table class='bootstrap' [rows]="items" [columns]="columns" [columnMode]="'force'"
              [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'">
              <ngx-datatable-column name="{{'Posicion' | translate}}">
                <ng-template ngx-datatable-cell-template let-value="value">
                  {{value}}
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="{{'Nombre' | translate}}">
                <ng-template ngx-datatable-cell-template let-value="value">
                  {{value}}
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="{{'HoraInicio' | translate}}">
                <ng-template ngx-datatable-cell-template let-value="value">
                  {{value}}
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="{{'HoraFin' | translate}}">
                <ng-template ngx-datatable-cell-template let-value="value">
                  {{value}}
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="{{'colorHorario' | translate}}">
                <ng-template ngx-datatable-cell-template let-value="value">
                  <div [style.background]="value" style="max-width: 50%;">{{value}}</div>
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="{{'Activo' | translate}}">
                <ng-template ngx-datatable-cell-template let-value="value">
                  {{value == true ? ('Si' | translate) : ('No' | translate)}}
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="{{'Acciones' | translate}}">
                <ng-template ngx-datatable-cell-template let-value="value" let-row="row">
                  <i placement="top" ngbTooltip="{{'Edit' | translate}}"
                  class="icofont icofont-pencil-alt-5 lh-editar" (click)="editar(row)"></i>
                </ng-template>
              </ngx-datatable-column>
            </ngx-datatable>
            <button class="cfg-btn cfg-btn--sec lh-excel"><i class="icofont icofont-file-excel"></i>Excel</button>
          </div>
        </div>
  </section>
</div>
