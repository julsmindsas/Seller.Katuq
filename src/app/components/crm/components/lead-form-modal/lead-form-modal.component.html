<div class="modal-header">
  <h5 class="modal-title">
    <i class="pi pi-user-plus me-2" style="color:#8b5cf6;"></i>{{ title }}
  </h5>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="cancelar()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" autocomplete="off">
    <div class="row g-3">

      <div class="col-12">
        <label class="form-label fw-semibold">Nombre completo / Razón social <span class="text-danger">*</span></label>
        <input pInputText formControlName="name" placeholder="Ej: Laura Gómez" class="w-100" />
        <small class="text-danger d-block mt-1"
          *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          El nombre es obligatorio
        </small>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input pInputText formControlName="email" placeholder="correo@ejemplo.com" class="w-100" />
        <small class="text-danger d-block mt-1"
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Correo inválido
        </small>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">Teléfono / WhatsApp</label>
        <input pInputText formControlName="phone" placeholder="3142087654" class="w-100" />
      </div>

      <div class="col-12 col-sm-5">
        <label class="form-label fw-semibold">Tipo de documento</label>
        <select formControlName="tipoDocumento" class="form-control form-select w-100">
          <option *ngFor="let o of tipoDocOptions" [value]="o.value">{{ o.label }}</option>
        </select>
      </div>

      <div class="col-12 col-sm-7">
        <label class="form-label fw-semibold">Número de documento</label>
        <input pInputText formControlName="nit" placeholder="Ej: 1045234567" class="w-100" />
      </div>

      <div class="col-12">
        <label class="form-label fw-semibold">
          <i class="fa fa-tag me-1" style="color:#8b5cf6;"></i>¿Qué le vas a vender?
        </label>
        <textarea pInputTextarea formControlName="productoInteres" rows="2"
          placeholder="Ej: Plan básico de ventas por WhatsApp, arreglos florales por catálogo digital, suscripción mensual..."
          class="w-100" style="resize:none; font-size:0.875rem;"></textarea>
        <small class="text-muted">Describe el producto o servicio que le vas a ofrecer.</small>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">Valor estimado (COP)</label>
        <p-inputNumber formControlName="estimatedValue" [useGrouping]="true" mode="currency" currency="COP"
          locale="es-CO" placeholder="Opcional" styleClass="w-100"></p-inputNumber>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">¿Cómo nos conoció?</label>
        <select formControlName="source" class="form-control form-select w-100">
          <option *ngFor="let o of sourceOptions" [value]="o.value">{{ o.label }}</option>
        </select>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">Prioridad</label>
        <select formControlName="priority" class="form-control form-select w-100">
          <option *ngFor="let o of priorityOpts" [value]="o.value">{{ o.label }}</option>
        </select>
      </div>

      <!-- Etiquetas -->
      <div class="col-12">
        <label class="form-label fw-semibold mb-1">
          <i class="pi pi-tags me-1" style="color:#8b5cf6;"></i>Etiquetas
        </label>
        <div class="tags-picker" *ngIf="tagsCatalog.length > 0">
          <span *ngFor="let tag of tagsCatalog" class="tag-chip"
            [class.tag-chip-selected]="tieneEtiqueta(tag.name)"
            [style.background-color]="tieneEtiqueta(tag.name) ? getTagBgColor(tag.color) : ''"
            [style.color]="tieneEtiqueta(tag.name) ? getTagFgColor(tag.color) : ''"
            (click)="toggleEtiqueta(tag.name)">
            <i class="pi pi-check me-1" *ngIf="tieneEtiqueta(tag.name)"></i>{{ tag.name }}
          </span>
        </div>
        <div class="tags-empty-hint" *ngIf="tagsCatalog.length === 0">
          <i class="pi pi-info-circle me-1"></i>No hay etiquetas configuradas.
        </div>
      </div>

    </div>
  </form>
</div>

<div class="modal-footer">
  <button pButton label="Cancelar" icon="pi pi-times" class="p-button-text p-button-secondary"
    (click)="cancelar()"></button>
  <button pButton [label]="isEdit ? 'Guardar' : 'Crear corporativo'" icon="pi pi-check"
    class="p-button-primary" (click)="guardar()" [disabled]="form.invalid"></button>
</div>
