<div class="modal-header lfm-cabeza">
  <h5 class="modal-title lfm-titulo">
    <span class="lfm-icono"><i class="pi pi-user-plus"></i></span>{{ title | translate }}
  </h5>
  <button type="button" class="btn-close" [attr.aria-label]="'comun.cerrar' | translate" (click)="cancelar()"></button>
</div>

<div class="modal-body lfm-cuerpo">
  <form [formGroup]="form" autocomplete="off" class="cfg-form">
    <div class="row g-3">

      <div class="col-12">
        <label class="form-label fw-semibold">{{ 'crm.formulario.nombreCompletoRazonSocial' | translate }} <span class="text-danger">*</span></label>
        <input pInputText formControlName="name" placeholder="{{ 'crm.formulario.ejLauraGomez' | translate }}" class="w-100" />
        <small class="text-danger d-block mt-1"
          *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          {{ 'crm.formulario.elNombreEsObligatorio' | translate }}
        </small>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">{{ 'crm.formulario.correoElectronico' | translate }}</label>
        <input pInputText formControlName="email" placeholder="{{ 'crm.formulario.correoEjemploCom' | translate }}" class="w-100" />
        <small class="text-danger d-block mt-1"
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          {{ 'crm.formulario.correoInvalido' | translate }}
        </small>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">{{ 'crm.formulario.telefonoWhatsapp' | translate }}</label>
        <input pInputText formControlName="phone" placeholder="3142087654" class="w-100" />
      </div>

      <div class="col-12 col-sm-5">
        <label class="form-label fw-semibold">{{ 'crm.formulario.tipoDeDocumento' | translate }}</label>
        <select formControlName="tipoDocumento" class="form-control form-select w-100">
          <option *ngFor="let o of tipoDocOptions" [value]="o.value">{{ o.label }}</option>
        </select>
      </div>

      <div class="col-12 col-sm-7">
        <label class="form-label fw-semibold">{{ 'crm.formulario.numeroDeDocumento' | translate }}</label>
        <input pInputText formControlName="nit" placeholder="{{ 'crm.formulario.ej1045234567' | translate }}" class="w-100" />
      </div>

      <div class="col-12">
        <label class="form-label fw-semibold">
          <i class="fa fa-tag me-1" style="color:#5F3FE0;"></i>{{ 'crm.formulario.queLeVasAVender' | translate }}
        </label>
        <textarea pInputTextarea formControlName="productoInteres" rows="2"
          placeholder="{{ 'crm.formulario.ejPlanBasicoDeVentas' | translate }}"
          class="w-100" style="resize:none; font-size:0.875rem;"></textarea>
        <small class="text-muted">{{ 'crm.formulario.describeElProductoOServicio' | translate }}</small>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">{{ 'crm.formulario.valorEstimadoCop' | translate }}</label>
        <p-inputNumber formControlName="estimatedValue" [useGrouping]="true" mode="currency" currency="COP"
          locale="es-CO" placeholder="{{ 'crm.formulario.opcional' | translate }}" styleClass="w-100"></p-inputNumber>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">{{ 'crm.formulario.comoNosConocio' | translate }}</label>
        <select formControlName="source" class="form-control form-select w-100">
          <option *ngFor="let o of sourceOptions" [value]="o.value">{{ o.label | translate }}</option>
        </select>
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label fw-semibold">{{ 'crm.formulario.prioridad' | translate }}</label>
        <select formControlName="priority" class="form-control form-select w-100">
          <option *ngFor="let o of priorityOpts" [value]="o.value">{{ o.label | translate }}</option>
        </select>
      </div>

      <!-- Ticket 1064: comercial responsable del lead -->
      <div class="col-12 col-sm-6" *ngIf="comerciales.length">
        <label class="form-label fw-semibold">{{ 'crm.formulario.comercialResponsable' | translate }}</label>
        <select formControlName="assignedTo" class="form-control form-select w-100">
          <option [ngValue]="null">{{ 'crm.formulario.sinAsignar' | translate }}</option>
          <option *ngFor="let c of comerciales" [ngValue]="c.email">{{ c.nombre }}</option>
        </select>
      </div>

      <!-- Etiquetas -->
      <div class="col-12">
        <label class="form-label fw-semibold mb-1">
          <i class="pi pi-tags me-1" style="color:#5F3FE0;"></i>{{ 'crm.formulario.etiquetas' | translate }}
        </label>
        <div class="tags-picker" *ngIf="tagsCatalog.length > 0">
          <span *ngFor="let tag of tagsCatalog" class="tag-chip"
            [class.tag-chip-selected]="tieneEtiqueta(tag.name)"
            [style.background-color]="tieneEtiqueta(tag.name) ? getTagBgColor(tag.color) : ''"
            [style.color]="tieneEtiqueta(tag.name) ? getTagFgColor(tag.color) : ''"
            (click)="toggleEtiqueta(tag.name)">
            <i class="pi pi-check me-1" *ngIf="tieneEtiqueta(tag.name)"></i>{{ tag.name }}
          </span>
        </div>
        <div class="tags-empty-hint" *ngIf="tagsCatalog.length === 0">
          <i class="pi pi-info-circle me-1"></i>{{ 'crm.formulario.noHayEtiquetasConfiguradas' | translate }}
        </div>
      </div>

    </div>
  </form>
</div>

<div class="modal-footer lfm-pie">
  <button pButton label="{{ 'comun.cancelar' | translate }}" icon="pi pi-times" class="p-button-text p-button-secondary lfm-btn lfm-btn--sec"
    (click)="cancelar()"></button>
  <button pButton [label]="isEdit ? ('comun.guardar' | translate) : ('crm.formulario.crearCorporativo' | translate)" icon="pi pi-check"
    class="p-button-primary lfm-btn" (click)="guardar()" [disabled]="form.invalid"></button>
</div>
