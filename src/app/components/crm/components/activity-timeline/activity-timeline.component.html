<!-- Add Activity Form -->
<div class="activity-form card mb-4">
  <div class="card-body">
    <h6 class="mb-3">{{ 'Registrar actividad' | translate }}</h6>
    <form [formGroup]="activityForm" (ngSubmit)="addActivity()">
      <div class="row align-items-end">
        <div class="col-md-3 mb-2">
          <p-dropdown [options]="activityTypes" formControlName="type" optionLabel="label" optionValue="value"
            [style]="{'width':'100%'}"></p-dropdown>
        </div>
        <div class="col-md-6 mb-2">
          <input pInputText formControlName="description" placeholder="{{ 'Descripción de la actividad...' | translate }}"
            class="w-100" />
        </div>
        <div class="col-md-3 mb-2">
          <button pButton type="submit" label="{{ 'Agregar' | translate }}" icon="pi pi-plus"
            class="p-button-sm w-100" [loading]="submitting" [disabled]="activityForm.invalid"></button>
        </div>
      </div>
      <div class="mt-2">
        <textarea pInputTextarea formControlName="detail" [rows]="2" [autoResize]="true"
          placeholder="{{ 'Notas adicionales (opcional)...' | translate }}" class="w-100"></textarea>
      </div>
    </form>
  </div>
</div>

<!-- Timeline -->
<div class="timeline" *ngIf="activities.length > 0">
  <div class="timeline-item" *ngFor="let activity of activities; trackBy: trackByActivityId">
    <div class="timeline-marker" [style.background-color]="getActivityColor(activity.type)">
      <i [class]="getActivityIcon(activity.type)" style="font-size: 0.7rem; color: #fff;"></i>
    </div>
    <div class="timeline-content">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <strong class="timeline-desc">{{ activity.description }}</strong>
          <p class="timeline-detail text-muted mb-0" *ngIf="activity.detail">{{ activity.detail }}</p>
          <!-- Status change badges -->
          <div *ngIf="activity.oldStatus || activity.newStatus" class="mt-1">
            <span *ngIf="activity.oldStatus" class="badge bg-secondary me-1">{{ activity.oldStatus }}</span>
            <i *ngIf="activity.oldStatus && activity.newStatus" class="pi pi-arrow-right mx-1" style="font-size:0.7rem;"></i>
            <span *ngIf="activity.newStatus" class="badge bg-primary">{{ activity.newStatus }}</span>
          </div>
        </div>
        <small class="text-muted text-nowrap ms-3">{{ formatDate(activity.createdAt) }}</small>
      </div>
      <small class="text-muted">{{ activity.createdBy }}</small>
    </div>
  </div>
</div>

<!-- Empty state -->
<div *ngIf="activities.length === 0" class="text-center p-4 text-muted">
  <i class="pi pi-clock" style="font-size: 2rem;"></i>
  <p class="mt-2">{{ 'No hay actividades registradas' | translate }}</p>
</div>
