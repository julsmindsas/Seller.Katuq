<form [formGroup]="form" (ngSubmit)="save()">

  <!-- ── Section 1: Información de contacto ── -->
  <h6 class="section-header">{{ 'Información de contacto' | translate }}</h6>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="name" class="form-label">{{ 'Nombre' | translate }} *</label>
      <input id="name" type="text" pInputText formControlName="name" class="w-100" />
      <small class="field-error" *ngIf="f['name'].touched && f['name'].hasError('required')">
        {{ 'El nombre es obligatorio' | translate }}
      </small>
    </div>

    <div class="col-md-6 mb-3">
      <label for="email" class="form-label">{{ 'Email' | translate }}</label>
      <input id="email" type="email" pInputText formControlName="email" class="w-100" />
      <small class="field-error" *ngIf="f['email'].touched && f['email'].hasError('email')">
        {{ 'Email no válido' | translate }}
      </small>
    </div>

    <div class="col-md-6 mb-3">
      <label for="phone" class="form-label">{{ 'Teléfono' | translate }}</label>
      <input id="phone" type="text" pInputText formControlName="phone" class="w-100" />
    </div>

    <div class="col-md-6 mb-3">
      <label for="whatsapp" class="form-label">{{ 'WhatsApp' | translate }}</label>
      <input id="whatsapp" type="text" pInputText formControlName="whatsapp" class="w-100" />
    </div>
  </div>

  <!-- ── Section 2: Información de empresa ── -->
  <h6 class="section-header">{{ 'Información de empresa' | translate }}</h6>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="companyName" class="form-label">{{ 'Empresa' | translate }}</label>
      <input id="companyName" type="text" pInputText formControlName="companyName" class="w-100" />
    </div>

    <div class="col-md-6 mb-3">
      <label for="position" class="form-label">{{ 'Cargo' | translate }}</label>
      <input id="position" type="text" pInputText formControlName="position" class="w-100" />
    </div>

    <div class="col-md-6 mb-3">
      <label for="sector" class="form-label">{{ 'Sector' | translate }}</label>
      <input id="sector" type="text" pInputText formControlName="sector" class="w-100" />
    </div>

    <div class="col-md-6 mb-3">
      <label for="city" class="form-label">{{ 'Ciudad' | translate }}</label>
      <input id="city" type="text" pInputText formControlName="city" class="w-100" />
    </div>
  </div>

  <!-- ── Section 3: CRM ── -->
  <h6 class="section-header">{{ 'CRM' | translate }}</h6>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="source" class="form-label">{{ 'Origen' | translate }}</label>
      <p-dropdown
        id="source"
        formControlName="source"
        [options]="sourceOptions"
        optionLabel="label"
        optionValue="value"
        [style]="{ width: '100%' }"
        placeholder="{{ 'Seleccionar origen' | translate }}"
      ></p-dropdown>
    </div>

    <div class="col-md-6 mb-3">
      <label for="priority" class="form-label">{{ 'Prioridad' | translate }}</label>
      <p-dropdown
        id="priority"
        formControlName="priority"
        [options]="priorityOptions"
        optionLabel="label"
        optionValue="value"
        [style]="{ width: '100%' }"
        placeholder="{{ 'Seleccionar prioridad' | translate }}"
      ></p-dropdown>
    </div>

    <div class="col-md-6 mb-3">
      <label for="estimatedValue" class="form-label">{{ 'Valor estimado' | translate }}</label>
      <p-inputNumber
        id="estimatedValue"
        formControlName="estimatedValue"
        mode="currency"
        currency="COP"
        locale="es-CO"
        [style]="{ width: '100%' }"
        [inputStyle]="{ width: '100%' }"
      ></p-inputNumber>
    </div>

    <div class="col-md-6 mb-3">
      <label for="tags" class="form-label">{{ 'Etiquetas' | translate }}</label>
      <p-chips
        id="tags"
        formControlName="tags"
        [style]="{ width: '100%' }"
        placeholder="{{ 'Agregar etiqueta' | translate }}"
      ></p-chips>
    </div>
  </div>

  <!-- ── Section 4: Notas ── -->
  <h6 class="section-header">{{ 'Notas' | translate }}</h6>
  <div class="row">
    <div class="col-12 mb-3">
      <textarea
        pInputTextarea
        formControlName="summary"
        rows="3"
        class="w-100"
        placeholder="{{ 'Resumen o notas del contacto...' | translate }}"
      ></textarea>
    </div>
  </div>

  <!-- ── Footer buttons ── -->
  <div class="form-footer" *ngIf="isEdit">
    <button
      pButton
      type="button"
      label="{{ 'Cancelar' | translate }}"
      class="p-button-outlined p-button-secondary"
      (click)="cancel()"
    ></button>
    <button
      pButton
      type="submit"
      label="{{ 'Guardar' | translate }}"
      class="p-button-primary"
      [disabled]="form.invalid"
    ></button>
  </div>
</form>
