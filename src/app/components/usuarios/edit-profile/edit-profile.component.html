<div class="cfg-pagina edit-profile">
        <header class="cfg-cabeza">
          <div class="cfg-cabeza__textos">
                <span class="cfg-eyebrow">Seguridad</span>
                <h1 class="cfg-titulo">Perfil de usuario</h1>
                <p class="cfg-sub">
                    Edita la imagen del usuario o la contraseña de ingreso.
                </p>
          </div>
        </header>

        <section class="cfg-card">
            <div class="row mb-2 g-3 align-items-center">
              <div class="col-auto">
                <img class="img-90 perfil-foto" [src]="this.img ? this.img : 'assets/images/user/user.png'" alt="profile">
              </div>
              <div class="col">
                <h3 class="mb-1 perfil-nombre">{{name}}</h3>
                <h5 class="mb-1 perfil-empresa">{{empre}}</h5>
                <h4 class="mb-1 perfil-rol">{{adm}}</h4>
              </div>
              <div class="col-auto">
                <label for="photoprofile" class="cfg-btn perfil-subir">
                  {{'Cambiar foto del perfil' | translate}}
                </label>
                <input type="file" #subirfoto (change)="uploadImage()" id="photoprofile" style='display: none;' />
              </div>
            </div>

            <!-- Sección para Prompt KAI -->
            <div class="kai-prompt-section cfg-form">
              <hr class="perfil-linea">
              <h5 class="cfg-card__titulo">{{ 'Personalizar K.A.I Prompt' | translate }}</h5>
              <p class="cfg-sub perfil-ayuda">{{ 'Define cómo quieres que K.A.I interactúe contigo o qué personalidad prefieres.' | translate }}</p>
              <div class="form-group">
                <label for="kaiPromptTextarea">{{ 'Tu Prompt Personalizado' | translate }}</label>
                <textarea class="form-control" id="kaiPromptTextarea" rows="4" [(ngModel)]="kaiPrompt"
                  [placeholder]="kaiPromptPlaceholder"></textarea> <!-- Cambiado a property binding -->
              </div>
              <div class="form-group perfil-acciones">
                 <button class="cfg-btn" type="button" (click)="saveKaiPrompt()">{{'Guardar Prompt' | translate}}</button>
              </div>
            </div>
            <!-- Fin Sección para Prompt KAI -->

<!-- 
            <h5 style="align-content: center;">{{'Edita tu contraseña' | translate}}</h5>
            // ... existing commented out password form ...
            </form> -->
            <hr class="perfil-linea">
            <app-shared-change-password></app-shared-change-password>
        </section>
