<section class="dom-secreto" role="group" [attr.aria-labelledby]="idCampo + '-titulo'">
  <div class="dom-secreto__cabeza">
    <i class="pi pi-key" aria-hidden="true"></i>
    <strong class="dom-secreto__titulo" [id]="idCampo + '-titulo'">{{ titulo }}</strong>
  </div>

  <p class="dom-secreto__descripcion" *ngIf="descripcion">{{ descripcion }}</p>

  <div class="cfg-aviso cfg-aviso--warn dom-aviso" role="alert">
    <i class="pi pi-exclamation-triangle dom-aviso__icono" aria-hidden="true"></i>
    <div class="dom-aviso__textos">
      <strong class="dom-aviso__titulo">{{ 'Cópialo ahora: no se podrá volver a ver' | translate }}</strong>
      <div class="dom-aviso__detalle">{{ 'Guárdalo en un lugar seguro. Si lo pierdes, tendrás que crear uno nuevo.' | translate }}</div>
    </div>
  </div>

  <div class="dom-secreto__fila">
    <!-- Un bloque de texto y no un campo: así la llave completa se ve entera, también en el celular (se parte en líneas). -->
    <code class="dom-secreto__valor" tabindex="0" [id]="idCampo" [attr.aria-labelledby]="idCampo + '-titulo'">{{ secreto }}</code>
    <button type="button" class="cfg-btn" (click)="copiar()">
      <i class="pi" [ngClass]="copiado ? 'pi-check' : 'pi-copy'" aria-hidden="true"></i>{{ (copiado ? 'Copiado' : 'Copiar') | translate }}
    </button>
  </div>

  <p class="dom-error" role="alert" *ngIf="noSePudoCopiar">
    {{ 'Tu navegador no dejó copiarlo. Selecciónalo y cópialo a mano.' | translate }}
  </p>

  <div class="dom-fila-botones">
    <button type="button" class="cfg-btn cfg-btn--sec" (click)="cerrar.emit()">{{ textoCerrar | translate }}</button>
  </div>
</section>
