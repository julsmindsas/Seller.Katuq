<div class="cx-page">

  <!-- Encabezado -->
  <div class="cx-header">
    <div class="cx-header-id">
      <span class="cx-header-icon"><i class="pi pi-chart-line"></i></span>
      <div>
        <h4 class="cx-page-title">Cartera (CxC)</h4>
        <p class="cx-page-sub">Cuánto te debe cada cliente, hace cuánto y la antigüedad de la deuda.</p>
      </div>
    </div>
    <button type="button" class="cx-refresh" (click)="load()" [disabled]="loading"
            aria-label="Actualizar cartera">
      <i class="pi" [ngClass]="loading ? 'pi-spin pi-spinner' : 'pi-refresh'"></i>
      Actualizar
    </button>
  </div>

  <!-- Error de permisos (403) -->
  <div *ngIf="forbidden && !loading" class="cx-error cx-error-perms" role="alert">
    <i class="pi pi-lock"></i>
    No tienes permiso para ver la cartera. Esta pantalla es para roles Tesorero o Administrador.
  </div>

  <!-- Error genérico -->
  <div *ngIf="error && !loading" class="cx-error" role="alert">
    <i class="pi pi-exclamation-triangle"></i>
    No se pudo cargar la cartera.
    <button type="button" class="cx-retry" (click)="load()">Reintentar</button>
  </div>

  <!-- Skeleton de carga -->
  <div *ngIf="loading" class="cx-grid" aria-busy="true">
    <div class="cx-card cx-skel" *ngFor="let i of [1,2,3,4]"></div>
  </div>

  <!-- Contenido -->
  <ng-container *ngIf="data && !loading && !error && !forbidden">

    <!-- Pestañas (segmented control) -->
    <div class="cx-tabs" role="tablist">
      <button type="button" role="tab" class="cx-tab" [class.is-active]="activeIndex === 0"
              [attr.aria-selected]="activeIndex === 0" (click)="onTabChange({ index: 0 })">
        <i class="pi pi-users"></i>
        <span>Cartera por Cliente</span>
      </button>
      <button type="button" role="tab" class="cx-tab" [class.is-active]="activeIndex === 1"
              [attr.aria-selected]="activeIndex === 1" (click)="onTabChange({ index: 1 })">
        <i class="pi pi-clock"></i>
        <span>Aging (Antigüedad)</span>
      </button>
    </div>

    <app-cartera-clientes *ngIf="activeIndex === 0" [data]="data"></app-cartera-clientes>
    <app-cartera-aging    *ngIf="activeIndex === 1" [data]="data"></app-cartera-aging>

  </ng-container>
</div>
