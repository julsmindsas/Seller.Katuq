<app-publica-marco ancho="angosto">
  <div class="pub-stack">
    <span class="pub-eyebrow">{{'changePassword.security' | translate}}</span>
    <h1 class="pub-h1">{{'changePassword.reminderTitle' | translate}}</h1>
    <p class="pub-lead">{{'changePassword.reminderLead' | translate}}</p>

    <form class="pub-stack" [formGroup]="passwordForm" (ngSubmit)="submit()" novalidate>
      <div class="pub-field">
        <label class="pub-label" for="nueva-clave">{{'changePassword.newPassword' | translate}}</label>
        <div class="pub-input" [class.is-error]="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
          <input #nuevaClave id="nueva-clave" type="password" formControlName="newPassword" autocomplete="new-password"
            placeholder="{{'changePassword.newPassword' | translate}}">
          <button type="button" class="pub-input__accion" (click)="nuevaClave.type = nuevaClave.type === 'password' ? 'text' : 'password'">
            {{ (nuevaClave.type === 'password' ? 'comun.mostrar' : 'comun.ocultar') | translate }}
          </button>
        </div>
        <p class="pub-help">{{'changePassword.rules' | translate}}</p>
        <div class="pub-error" role="alert" aria-live="polite" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
          {{'changePassword.rulesError' | translate}}
        </div>
      </div>

      <div class="pub-field">
        <label class="pub-label" for="confirmar-clave">{{'changePassword.confirmPassword' | translate}}</label>
        <div class="pub-input" [class.is-error]="passwordForm.errors?.mismatch && passwordForm.get('confirmPassword')?.touched">
          <input #confirmarClave id="confirmar-clave" type="password" formControlName="confirmPassword" autocomplete="new-password"
            placeholder="{{'changePassword.confirmPassword' | translate}}">
          <button type="button" class="pub-input__accion" (click)="confirmarClave.type = confirmarClave.type === 'password' ? 'text' : 'password'">
            {{ (confirmarClave.type === 'password' ? 'comun.mostrar' : 'comun.ocultar') | translate }}
          </button>
        </div>
        <div class="pub-error" role="alert" aria-live="polite" *ngIf="passwordForm.errors?.mismatch && passwordForm.get('confirmPassword')?.touched">
          {{'changePassword.mismatch' | translate}}
        </div>
      </div>

      <button type="submit" [disabled]="passwordForm.invalid" class="pub-btn">
        {{'changePassword.submit' | translate}}
      </button>
      <button type="button" (click)="deferUpdate()" class="pub-btn pub-btn--sec">
        {{'changePassword.later' | translate}}
      </button>
    </form>
  </div>
</app-publica-marco>
