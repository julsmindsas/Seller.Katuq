<div class="cfg-pagina">
    <header class="cfg-cabeza">
        <div class="cfg-cabeza__textos">
            <span class="cfg-eyebrow">Configuración</span>
            <h1 class="cfg-titulo">Procesos</h1>
            <p class="cfg-sub">Módulos variables · Producción</p>
        </div>
        <div class="cfg-acciones">
                            <button class="cfg-btn" type="button"
                                (click)="open(myModal)">
                                <span>{{'Crear Nuevo Proceso' | translate}}</span>
                                <i placement="top"
                                    class="icofont icofont-plus"></i>
                            </button>
        </div>
    </header>

    <section class="cfg-card">
                    <div class="row">
                        <div class="col-sm-12 pr-organigrama">
                            <p-organizationChart [value]="procesosConCentrosTrabajos" selectionMode="single"
                                [(selection)]="selectedNode" (onNodeSelect)="onNodeSelect($event)" styleClass="company">
                                <ng-template let-node pTemplate="person">
                                    <div class="node-header">{{node.label}}</div>
                                    <!-- <div class="node-content">
                                        <div>{{node.data.nombre}}</div>
                                    </div> -->
                                </ng-template>
                            </p-organizationChart>
                        </div>
                    </div>
    </section>
</div>

<!--crear modal para crear procesos y centros de trabajo-->
<ng-template #myModal let-modal>
    <!-- <div class="modal-dialog" role="document"> -->
    <div class="modal-content">
        <div class="modal-header mo-cabeza">
            <h5 class="modal-title mo-titulo">{{'Crear Proceso o Centro de Trabajo' | translate}}</h5>
            <button type="button" class="close mo-cerrar" (click)="modal.dismiss('Cross click')">
                <span aria-hidden="true" class="mo-cerrar__x">&times;</span>
            </button>
        </div>
        <div class="modal-body cfg-form">
            <div class="form-group">
                <label for="exampleInputEmail1">{{'Nombre' | translate}}</label>
                <input type="text" class="form-control" id="exampleInputEmail1" [(ngModel)]="procesoNuevo.nombre"
                    aria-describedby="emailHelp" placeholder="{{'Nombre del proceso o centro de trabajo' | translate}}">
            </div>
            <hr class="mo-linea">
            <!-- Aquí puedes poner el formulario para crear el proceso o centro de trabajo -->
            <p-pickList [source]="centrosTrabajoSource" [target]="procesoNuevo.centrosTrabajo"
                sourceHeader="{{'Centros de trabajo disponible' | translate}}" targetHeader="{{'Centros de trabajo seleccionados' | translate}}"
                [dragdrop]="true" [responsive]="true" [sourceStyle]="{'height':'30rem'}"
                [targetStyle]="{'height':'30rem'}" filterBy="nombre" sourceFilterPlaceholder="{{'Buscar por nombre' | translate}}"
                targetFilterPlaceholder="{{'Buscar por nombre' | translate}}">
                <ng-template let-center pTemplate="item">
                    <!-- style="font-size:14px;float:right;margin:15px 5px 0 0" -->
                    <div>{{center?.nombre}}</div>

                </ng-template>
            </p-pickList>
        </div>
        <div class="modal-footer mo-pie">
            <button type="button" class="cfg-btn cfg-btn--sec" (click)="cerrarModal()">{{'Cerrar' | translate}}</button>
            <button type="button" class="cfg-btn" (click)="createProcessAndCentroTrabajo()">{{'Guardar cambios' | translate}}</button>
        </div>
    </div>
    <!-- </div> -->
</ng-template>

<!--modal para editar o eliminar proceso con solo dos botones -->

<ng-template #editDeleteModal let-modal>
    <div class="modal-content">
        <div class="modal-header mo-cabeza">
            <h5 class="modal-title mo-titulo">{{'Editar o Eliminar Proceso' | translate}}</h5>
            <button type="button" class="close mo-cerrar" (click)="modal.dismiss('Cross click')">
                <span aria-hidden="true" class="mo-cerrar__x">&times;</span>
            </button>
        </div>
        <div class="modal-body cfg-form">
            <!-- dos botones opciones eliminar o editar -->
            <div class="container ">
                <div class="row">
                    <div class="col-sm-2"></div>
                    <div class="col-sm-8">
                        <div class="row">
                            <div class="col-6">
                                <button class="cfg-btn cfg-btn--peligro w-100" (click)="deleteProcess()">{{'Eliminar' | translate}}</button>
                            </div>
                            <div class="col-6">
                                <button class="cfg-btn w-100" (click)="editProcess()">{{'Editar' | translate}}</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-2">

                    </div>
                </div>
            </div>

        </div>
        <div class="modal-footer mo-pie">

        </div>
    </div>
</ng-template>
