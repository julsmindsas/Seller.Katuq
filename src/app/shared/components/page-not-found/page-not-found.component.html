<app-publica-marco ancho="angosto" rutaLogo="/welcome">
  <div class="pub-stack">
    <div class="pub-estado pub-estado--info" aria-hidden="true">
      <i class="fa fa-compass"></i>
    </div>
    <span class="pub-eyebrow">{{ 'publica.notFound.eyebrow' | translate }}</span>
    <h1 class="pub-h1">{{ 'publica.notFound.title' | translate }}</h1>
    <p class="pub-lead">{{ 'publica.notFound.text' | translate }}</p>
    <a class="pub-btn" [routerLink]="'/welcome/'">{{ 'publica.backHome' | translate }}</a>
    <p class="pub-fine">{{ 'publica.notFound.help' | translate }}</p>
  </div>
</app-publica-marco>
