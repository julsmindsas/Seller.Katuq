<!-- Nombre del comercio en cursiva (rediseño 2026 "Almara") + logo pequeño si existe -->
<div class="company-brand" *ngIf="companyInformation">
    <img *ngIf="companyInformation?.imgUrlLogo"
         [src]="getLogoUrl()"
         alt="logo"
         class="company-brand-logo"
         (error)="onLogoError($event)">
    <span class="company-brand-name">{{ companyInformation?.nomComercial || companyInformation?.razonSocial }}</span>
</div>
