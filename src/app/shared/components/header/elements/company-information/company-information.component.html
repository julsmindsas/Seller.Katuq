<!-- Nombre del comercio en cursiva (rediseño 2026 "Almara") + logo pequeño si existe -->
<div class="company-brand" *ngIf="companyInformation"
     [attr.title]="companyInformation?.razonSocial || companyInformation?.nomComercial">
    <img *ngIf="companyInformation?.imgUrlLogo"
         [src]="getLogoUrl()"
         [alt]="'shell.company.logoAlt' | translate"
         class="company-brand-logo"
         (error)="onLogoError($event)">
    <span class="company-brand-name" [class.company-brand-name--con-logo]="!!companyInformation?.imgUrlLogo">{{ companyInformation?.nomComercial || companyInformation?.razonSocial }}</span>
</div>
