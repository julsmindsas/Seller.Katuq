<div class="translate_wrapper" [class.active]="navServices.language" id="languages-menu" role="menu" aria-label="Selector de idioma">
  <button class="current_lang" type="button" aria-haspopup="true" [attr.aria-expanded]="navServices.language">
    <span class="lang">
      <i class="flag-icon flag-icon-{{selectedLanguage.icon}}" aria-hidden="true"></i>
      <span class="lang-txt">{{selectedLanguage.code}}</span>
    </span>
  </button>
  <div class="more_lang" [class.active]="navServices.language">
    <button class="lang selected" type="button" role="menuitem" data-value="en" (click)="changeLanguage(lang)" *ngFor="let lang of languages"
            [attr.aria-label]="'Cambiar a ' + lang.language">
      <i class="flag-icon flag-icon-{{lang.icon}}" aria-hidden="true"></i>
      <span class="lang-txt">{{lang.language}}<span *ngIf="lang.type">({{lang.type}})</span></span>
    </button>
  </div>
</div>
