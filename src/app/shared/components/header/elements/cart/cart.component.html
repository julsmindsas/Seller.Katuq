<div class="cart-box" (click)="toggleCart()" role="button" aria-haspopup="true" [attr.aria-expanded]="openCart" aria-controls="cart-dropdown" tabindex="0"
     (keydown.enter)="toggleCart()" (keydown.space)="$event.preventDefault(); toggleCart()">
  <app-feather-icons [icon]="'shopping-cart'"></app-feather-icons>
<span class="badge rounded-pill badge-primary" *ngIf="(cartData?.length ?? 0) > 0">{{cartData?.length}}</span>
</div>
<ul class="cart-dropdown onhover-show-div" [class.active]="openCart" id="cart-dropdown" role="menu" aria-label="Carrito de compras">
  <li style="padding: 8px 0 6px 0 !important;">
    <h6 class="mb-0" style="font-size: 16px; font-weight: 600;">Carrito</h6>
    <app-feather-icons [icon]="'shopping-cart'"></app-feather-icons>
  </li>
  <li class="mt-0" *ngFor="let item of cartData">
    <div class="d-flex position-relative">
      <img class="img-fluid rounded-circle me-3 img-60"
        src="{{item?.producto?.crearProducto?.imagenesPrincipales[0].urls}}" alt="">
      <div class="media-body">
        <span>{{item?.producto.crearProducto?.titulo}}</span>
        <!-- <p>Yellow(#fcb102)</p> -->
        <div class="qty-box">
          <div class="input-group">
            <span class="input-group-prepend">
              <button class="btn quantity-left-minus" type="button" data-type="minus" data-field=""><i
                  data-feather="minus"></i></button>
            </span>
            <input class="form-control input-number" type="text" name="quantity" value="1">
            <span class="input-group-prepend">
              <button class="btn quantity-right-plus" type="button" data-type="plus" data-field=""><i
                  data-feather="plus"></i></button>
            </span>
          </div>
        </div>
        <h6 class="text-end text-muted">{{item?.producto.precio?.precioUnitarioSinIva | currency:'USD'}}</h6>
      </div>
      <div class="close-circle">
        <a href="#">
          <app-feather-icons [icon]="'x'"></app-feather-icons>
        </a>
      </div>
    </div>
  </li>

    <div class="total">
      <h6 class="mb-0 mt-0 text-muted" style="font-size: 14px;">Total: <span class="f-right" style="font-size: 16px; font-weight: 600;">{{totalCarrito | currency}}</span></h6>
