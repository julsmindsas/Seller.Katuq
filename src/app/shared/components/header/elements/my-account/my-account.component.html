<div class="d-flex profile-media" (click)="toggleAccount()" role="button" aria-haspopup="true" [attr.aria-expanded]="openAccount" aria-controls="account-dropdown" tabindex="0"
     (keydown.enter)="toggleAccount()" (keydown.space)="$event.preventDefault(); toggleAccount()">
  <img class="b-r-10" [src]="user.image ? user.image : 'assets/images/user/user.png'" alt="profile" style="max-height: 40px; width: auto;">
  <div class="media-body">
    <span>{{user.name}}</span><i class="middle fa fa-angle-down"></i>
    <p class="mb-0 font-roboto user-details">
      {{ (user?.company === '' ? 'Sin empresa' : (user?.company === 'La Tartaleria' ? 'La Tartaleteria' : user?.company)) }} | {{user?.rol }}
    </p>
  </div>
</div>
<ul class="profile-dropdown onhover-show-div" [class.active]="openAccount" id="account-dropdown" role="menu" aria-label="Opciones de cuenta">
  <!-- Mi Cuenta - Always visible -->
  <li>
    <a [routerLink]="'/' + accountMenuItem.path" (click)="openAccount = false">
      <app-feather-icons [icon]="accountMenuItem.icon"></app-feather-icons>
      <span>{{ accountMenuItem.label }}</span>
    </a>
  </li>

  <!-- Other menu items - Only shown if user is authorized -->
  <li *ngFor="let item of authorizedMenuItems">
    <a [routerLink]="'/' + item.path" (click)="openAccount = false">
      <app-feather-icons [icon]="item.icon"></app-feather-icons>
      <span>{{ item.label }}</span>
    </a>
  </li>

  <!-- Logout - Always available -->
  <li><a (click)="logOut()" role="menuitem">
    <app-feather-icons [icon]="'log-in'"></app-feather-icons>
    <span>{{ 'Cerrar sesión' | translate }}</span>
  </a></li>
</ul>
