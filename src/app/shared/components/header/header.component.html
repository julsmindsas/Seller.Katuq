<!-- Subscription Banner -->
<div class="subscription-banner" *ngIf="(subscriptionService.subscription$ | async) as sub"
     [hidden]="sub.plan === 'premium'">
  <div class="d-flex align-items-center justify-content-center gap-2 py-1 px-3"
       [style.background]="(subscriptionService.usage$ | async)?.orders?.remaining <= 3 ? '#fee2e2' : '#eef0fb'"
       [style.color]="(subscriptionService.usage$ | async)?.orders?.remaining <= 3 ? '#991b1b' : '#5c6ac4'"
       style="font-size: 0.75rem; border-bottom: 1px solid rgba(0,0,0,0.06);">
    <i class="pi pi-info-circle" style="font-size: 0.7rem;"></i>
    <span *ngIf="(subscriptionService.usage$ | async) as usage">
      Plan Gratuito — {{ usage.orders?.remaining >= 0 ? usage.orders?.remaining : 0 }} pedidos restantes este mes
    </span>
    <a routerLink="/pricing" style="font-weight: 600; text-decoration: underline; cursor: pointer;">
      Actualizar
    </a>
  </div>
</div>

<!-- Page Header Start - CLEAN VERSION -->
<div class="page-header" [class.close_icon]="navServices.collapseSidebar" role="banner" aria-label="Encabezado principal">
  <div class="header-wrapper row m-0">
    <!-- Search component (hidden) -->
    <app-search></app-search>

    <!-- LOGOS SECTION - Katuq + Empresa -->
    <div class="header-logos-section col-auto d-flex align-items-center gap-3 px-2">
      <!-- Logo Katuq -->
      <a routerLink='/' class="logo-link katuq-logo">
        <img class="img-fluid logo-light" src="assets/images/logo/Katuq/katuq_light.svg" alt="Katuq" style="max-height: 28px;">
        <img class="img-fluid logo-dark" src="assets/images/logo/Katuq/katuq_dark.svg" alt="Katuq" style="max-height: 28px;">
      </a>

      <!-- Separador -->
      <div class="logo-divider"></div>

      <!-- Logo Empresa -->
      <div class="company-logo">
        <app-company-information></app-company-information>
      </div>
    </div>

    <!-- NAV RIGHT - Elementos esenciales -->
    <div class="nav-right col pull-right right-header p-0 ms-auto">
      <ul class="nav-menus">
        <!-- Language Selector -->
        <li class="language-nav" (click)="languageToggle()" role="button" tabindex="0"
            aria-haspopup="true" [attr.aria-expanded]="navServices.language"
            (keydown.enter)="languageToggle()" (keydown.space)="$event.preventDefault(); languageToggle()">
          <app-languages></app-languages>
        </li>

        <!-- Dark Mode Toggle -->
        <li>
          <button class="mode" type="button" (click)="layoutToggle()" [attr.aria-pressed]="dark" aria-label="Cambiar tema">
            <i class="fa fa-moon-o" *ngIf="!dark" aria-hidden="true"></i>
            <i class="fa fa-lightbulb-o" *ngIf="dark" aria-hidden="true"></i>
          </button>
        </li>

        <!-- Notifications -->
        <li class="onhover-dropdown" aria-label="Notificaciones">
          <app-notification-center></app-notification-center>
        </li>

        <!-- Profile + Logout -->
        <li class="profile-nav onhover-dropdown p-0" aria-label="Mi cuenta">
          <app-my-account></app-my-account>
        </li>
      </ul>
    </div>
  </div>

  <!-- Aviso de versión nueva: solo aparece si el servidor publicó una versión
       distinta a la cargada (VersionCheckService). Va FUERA de .header-wrapper,
       en su propia franja: dentro de la fila le robaba ancho al buscador y a las
       acciones de la derecha. Cuando no hay actualización no ocupa alto. -->
  <div class="header-actualizacion-franja">
    <app-aviso-actualizacion></app-aviso-actualizacion>
  </div>
</div>
<!-- Page Header Ends -->
