<div class="equipo-selector">
  <p-multiSelect
    *ngIf="multiple; else uno"
    [inputId]="inputId"
    [options]="opciones"
    [ngModel]="valorMultiple"
    (ngModelChange)="alCambiarVarios($event)"
    [filter]="true"
    filterBy="label"
    [disabled]="disabled"
    [defaultLabel]="placeholder"
    [selectedItemsLabel]="('selectorEquipo.selectorEquipo.0Personas' | translate)"
    [maxSelectedLabels]="3"
    [showToggleAll]="false"
    appendTo="body"
    [overlayOptions]="overlay"
    [emptyFilterMessage]="'selectorEquipo.selectorEquipo.noHayNadieConEse' | translate"
    [emptyMessage]="'selectorEquipo.selectorEquipo.noHayPersonasParaElegir' | translate"
    [style]="{ width: '100%' }"
  ></p-multiSelect>

  <ng-template #uno>
    <p-dropdown
      [inputId]="inputId"
      [options]="opciones"
      [ngModel]="valorUnico"
      (ngModelChange)="alCambiarUno($event)"
      [filter]="true"
      filterBy="label"
      [disabled]="disabled"
      [placeholder]="placeholder"
      [showClear]="false"
      appendTo="body"
      [overlayOptions]="overlay"
      [emptyFilterMessage]="'selectorEquipo.selectorEquipo.noHayNadieConEse' | translate"
      [emptyMessage]="'selectorEquipo.selectorEquipo.noHayPersonasParaElegir' | translate"
      [style]="{ width: '100%' }"
    ></p-dropdown>
  </ng-template>
</div>
