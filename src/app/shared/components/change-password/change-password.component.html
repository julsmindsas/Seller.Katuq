<div class="container-fluid">
  <!-- Logo similar al de Diagnostic Survey -->
  <!-- <img class="survey-logo" src="assets/images/logo/Katuq/katuq_dark.svg" alt="Katuq Logo"> -->
  <div class="animate-fancy">
    <h3>{{ 'changePassword.canUpdate' | translate }}</h3>
    <form class="mt-5" [formGroup]="passwordForm" (ngSubmit)="submit()">
      <div class="row col-12 fs-14">
        <div class="col-md-4">
          <label for="currentPassword">{{ 'changePassword.currentPassword' | translate }}</label>
          <input id="currentPassword" type="password" formControlName="Password" [placeholder]="'changePassword.currentPassword' | translate" class="material-input">
          <div class="fc-danger mb-3"
            *ngIf="passwordForm.get('Password')?.touched && passwordForm.get('Password')?.invalid">
            {{ 'changePassword.currentRequired' | translate }}
          </div>
        </div>
        <div class="col-md-4">
          <label for="newPassword">{{ 'changePassword.newPassword' | translate }}</label>
          <input id="newPassword" type="password" formControlName="newPassword" [placeholder]="'changePassword.newPassword' | translate" class="material-input">
          <div class="fc-danger mb-3"
            *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
            {{ 'changePassword.rulesError' | translate }}
          </div>
        </div>
        <div class="col-md-4">
          <label for="confirmPassword">{{ 'changePassword.confirmPassword' | translate }}</label>
          <input id="confirmPassword" type="password" formControlName="confirmPassword" [placeholder]="'changePassword.confirmPassword' | translate"
            class="material-input">
          <div class="fc-danger mb-3"
            *ngIf="passwordForm.errors?.mismatch && passwordForm.get('confirmPassword')?.touched">
            {{ 'changePassword.mismatch' | translate }}
          </div>
        </div>
      </div>
      <br>
      <!-- Si aún no se ha confirmado, mostrar el botón de submit -->
      <div style="text-align: end;">
        <button class="btn btn-primary fc-white" type="submit" [disabled]="passwordForm.invalid">
          {{ 'changePassword.submit' | translate }}
        </button>
      </div>
    </form>
    <!-- Confirmación inline -->
    <!-- <div *ngIf="confirmVisible" class="confirmation-box">
      <p>¿Estás seguro de que deseas actualizar tu contraseña?</p>
      <button (click)="confirmUpdate()" class="next-button">Sí, actualizar</button>
      <button (click)="cancelUpdate()" class="back-button">Cancelar</button>
    </div> -->
  </div>
</div>
