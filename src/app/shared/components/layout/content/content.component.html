<!-- page-wrapper Start-->
<div [ngClass]="layout.config.settings.layout_type" [class]="layout.config.settings.layout_version">
  <div class="page-wrapper" id="canvas-bookmark" [ngClass]="layoutClass">
    <app-header></app-header>
    <!-- Page Body Start-->
    <div class="page-body-wrapper">
      <!-- Sidebar: menú lateral en escritorio, drawer deslizable en móvil (se abre con "Menú") -->
      <div class="sidebar-wrapper"
           [attr.sidebar-layout]="layout.config.settings.sidebar_type"
           [class.close_icon]="navServices.collapseSidebar">
        <app-sidebar></app-sidebar>
      </div>
      
      <div class="page-body">
        <main [@fadeInAnimation]="getRouterOutletState(o)">
          <router-outlet #o="outlet"></router-outlet>
        </main>
      </div>
      
      <!-- footer start-->
      <footer class="footer">
        <br/>
        <br/>
        <!-- <app-footer></app-footer> -->
      </footer>
      <!-- footer End-->
    </div>
    <!-- Page Body End-->
  </div>

  <!-- Navegación móvil: barra inferior fija. El menú completo se abre como drawer (botón "Menú"). -->
  <app-bottom-navigation></app-bottom-navigation>
</div>
<!-- page-wrapper End-->
