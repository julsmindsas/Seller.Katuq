<div class="sphere-visual-container-wrapper">
  <!-- Contenedor principal de visualización esférica -->
  <div class="sphere-main-container" [class.celebration-mode]="isCelebrationMode" [class.audio-reactive]="isAudioReactive">
    
    <!-- Componente de visualización esférica 3D -->
    <app-sphere-visual 
      *ngIf="currentConfig"
      [sphereConfig]="currentConfig"
      [inputNode]="inputNode"
      [outputNode]="outputNode">
    </app-sphere-visual>

    <!-- Información del paso actual -->
    <div class="step-info" *ngIf="currentConfig">
      <div class="step-name">{{ currentConfig.stepName | titlecase }}</div>
      <div class="animation-type">{{ currentConfig.animationType | uppercase }}</div>
      <div class="particle-count">{{ currentConfig.particleCount }} {{ 'asistentes.sphereVisualContainer.particulas' | translate }}</div>
    </div>

    <!-- Controles de visualización -->
    <div class="visual-controls">
      <button 
        class="control-btn audio-btn" 
        [class.active]="isAudioReactive"
        (click)="toggleAudioReactivity(!isAudioReactive)"
        [title]="'asistentes.sphereVisualContainer.activarDesactivarReactividadAlAudio' | translate">
        <i class="fa fa-volume-up"></i>
      </button>
      
      <button 
        class="control-btn celebration-btn" 
        [class.active]="isCelebrationMode"
        (click)="toggleCelebrationMode(!isCelebrationMode)"
        [title]="'asistentes.sphereVisualContainer.activarDesactivarModoCelebracion' | translate">
        <i class="fa fa-star"></i>
      </button>
      
      <button 
        class="control-btn clear-btn"
        (click)="clearVisual()"
        [title]="'asistentes.sphereVisualContainer.limpiarVisualizacion' | translate">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <!-- Evento actual -->
    <div class="current-event" *ngIf="currentEvent">
      <div class="event-type">{{ currentEvent.type | uppercase }}</div>
      <div class="event-data" *ngIf="currentEvent.data">
        {{ currentEvent.data.message || currentEvent.data.celebrationType }}
      </div>
    </div>
  </div>

  <!-- Botones de prueba para desarrollo -->
  <div class="test-controls" *ngIf="false">
    <button (click)="createSphereVisual('bodega')">{{ 'asistentes.sphereVisualContainer.bodega' | translate }}</button>
    <button (click)="createSphereVisual('productos')">{{ 'asistentes.sphereVisualContainer.productos' | translate }}</button>
    <button (click)="createSphereVisual('carrito')">{{ 'asistentes.sphereVisualContainer.carrito' | translate }}</button>
    <button (click)="createSphereVisual('cliente')">{{ 'asistentes.sphereVisualContainer.cliente' | translate }}</button>
    <button (click)="createSphereVisual('envio')">{{ 'asistentes.sphereVisualContainer.envio' | translate }}</button>
    <button (click)="createSphereVisual('facturacion')">{{ 'asistentes.sphereVisualContainer.facturacion' | translate }}</button>
    <button (click)="createSphereVisual('pago')">{{ 'asistentes.sphereVisualContainer.pago' | translate }}</button>
    <button (click)="createSphereVisual('confirmacion')">{{ 'asistentes.sphereVisualContainer.confirmacion' | translate }}</button>
    <button (click)="activateCelebration('success')">{{ 'asistentes.sphereVisualContainer.celebracion' | translate }}</button>
    <button (click)="showNotification('¡Prueba exitosa!', 'success')">{{ 'asistentes.sphereVisualContainer.notificacion' | translate }}</button>
  </div>
</div>
