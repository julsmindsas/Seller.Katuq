<div class="live-audio-fullscreen">
  <!-- Header -->
  <div class="header">
    <h1>🎤 Live Audio - Asistente Katuq</h1>
    <button class="close-btn" (click)="closeFullscreen()">
      <i class="fa fa-times"></i> Cerrar
    </button>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Visual3D Component - Full Screen -->
    <div class="visual-container">
      <app-visual3d 
        [inputNode]="inputNode" 
        [outputNode]="outputNode"
        [katuqToolEvent]="currentKatuqToolEvent">
      </app-visual3d>
    </div>

    <!-- Componente Visual Mejorado con Logs -->
    <div class="visual-logs-container">
      <app-visual 
        [inputNode]="inputNode" 
        [outputNode]="outputNode">
      </app-visual>
    </div>

    <!-- Controls Overlay -->
    <div class="controls-overlay">
      <div class="controls">
        <button id="resetButton" (click)="reset()" [disabled]="isRecording">
          <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#ffffff">
            <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z" />
          </svg>
        </button>
        
        <!-- Botón único para activar/desactivar micrófono -->
        <button 
          id="toggleRecordingButton" 
          (click)="toggleRecording()" 
          [ngClass]="{'recording': isRecording, 'idle': !isRecording}">
          <svg *ngIf="!isRecording" xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#ffffff">
            <path d="M480-400q-50 0-85-35t-35-85v-200q0-50 35-85t85-35q50 0 85 35t35 85v200q0 50-35 85t-85 35Zm0-80q17 0 28.5-11.5T520-520v-200q0-17-11.5-28.5T480-760q-17 0-28.5 11.5T440-720v200q0 17 11.5 28.5T480-480Zm0 280q-83 0-156-31.5T197-297q-24-24-28.5-57t.5-66l64-266q5-21 24.5-35.5T300-740h360q21 0 40.5 14.5T725-690l64 266q5 33 .5 66T763-297q-54 54-127 85.5T480-180Z"/>
          </svg>
          <svg *ngIf="isRecording" xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#c80000">
            <path d="M480-400q-50 0-85-35t-35-85v-200q0-50 35-85t85-35q50 0 85 35t35 85v200q0 50-35 85t-85 35Zm0 220q-113 0-207.5-56T120-387v-153q0-51 34.5-85.5T240-660h80v-40q0-50 35-85t85-35h80q50 0 85 35t35 85v40h80q51 0 85.5 34.5T840-540v153q-51 86-145.5 142T480-180Z"/>
          </svg>
        </button>

        <!-- Botón de prueba para visuales -->
        <button id="testVisualsButton" (click)="testVisuals()" style="
          background: rgba(255,255,255,0.1);
          border: 1px solid rgba(255,255,255,0.3);
          color: white;
          padding: 10px 15px;
          border-radius: 25px;
          cursor: pointer;
          font-size: 0.8rem;
          margin-left: 10px;
        ">
          🎨 Test Visuales
        </button>
      </div>
    </div>

    <!-- Status Overlay -->
    <div class="status-overlay">
      <div class="status">
        <span class="status-text">{{ status }}</span>
        <span class="error-text" *ngIf="error">{{ error }}</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>🎯 Habla con el asistente para probar las herramientas de Katuq</p>
  </div>
</div>
