<div class="live-audio-fullscreen">
  <!-- Header -->
  <div class="header">
    <h1>🎤 Live Audio - Asistente Katuq</h1>
    <button class="close-btn" (click)="closeFullscreen()">
      <i class="fa fa-times"></i> Cerrar
    </button>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Visual3D Component - Full Screen -->
    <div class="visual-container">
      <app-visual3d 
        [inputNode]="inputNode" 
        [outputNode]="outputNode"
        [katuqToolEvent]="currentKatuqToolEvent">
      </app-visual3d>
    </div>

    <!-- Componente Visual Mejorado con Logs -->
    <div class="visual-logs-container">
      <app-visual 
        [inputNode]="inputNode" 
        [outputNode]="outputNode">
      </app-visual>
    </div>

    <!-- Controls Overlay -->
    <div class="controls-overlay">
      <div class="controls">
        <button id="resetButton" (click)="reset()" [disabled]="isRecording">
          <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#ffffff">
            <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z" />
          </svg>
        </button>
        <button id="startButton" (click)="startRecording()" [disabled]="isRecording">
          <svg viewBox="0 0 100 100" width="32px" height="32px" fill="#c80000" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="50" />
          </svg>
        </button>
        <button id="stopButton" (click)="stopRecording()" [disabled]="!isRecording">
          <svg viewBox="0 0 100 100" width="32px" height="32px" fill="#000000" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="100" height="100" rx="15" />
          </svg>
        </button>
        <!-- Botón de prueba para visuales -->
        <button id="testVisualsButton" (click)="testVisuals()" style="
          background: rgba(255,255,255,0.1);
          border: 1px solid rgba(255,255,255,0.3);
          color: white;
          padding: 10px 15px;
          border-radius: 25px;
          cursor: pointer;
          font-size: 0.8rem;
          margin-left: 10px;
        ">
          🎨 Test Visuales
        </button>
      </div>
    </div>

    <!-- Status Overlay -->
    <div class="status-overlay">
      <div class="status">
        <span class="status-text">{{ status }}</span>
        <span class="error-text" *ngIf="error">{{ error }}</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>🎯 Habla con el asistente para probar las herramientas de Katuq</p>
  </div>
</div>
