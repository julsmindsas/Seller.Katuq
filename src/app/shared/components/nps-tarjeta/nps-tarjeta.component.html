<ng-container *ngIf="pregunta.estado$ | async as e">
  <!-- Ventana al entrar (D-506): la primera vez del ciclo. -->
  <div *ngIf="e.presentacion === 'ventana'" class="nt-velo" (click)="cerrarDesdeVelo($event)">
    <section
      class="nt-ventana"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="e.paso === 'gracias' ? null : 'ntv-pregunta'"
      [attr.aria-label]="e.paso === 'gracias' ? 'Gracias por tu opinión' : null"
      (keydown.escape)="cerrar()"
    >
      <button type="button" class="nt-cerrar" (click)="cerrar()" aria-label="Cerrar">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
      <app-nps-pregunta idBase="ntv"></app-nps-pregunta>
    </section>
  </div>

  <!-- Fuera de Inicio: un botón pequeño que abre la tarjeta. En Inicio la pone app-nps-inicio. -->
  <ng-container *ngIf="e.presentacion === 'tarjeta' && !enInicio">
    <button
      *ngIf="!expandida && e.paso === 'nota'; else tarjeta"
      type="button"
      class="nt-boton"
      aria-haspopup="dialog"
      (click)="expandida = true"
    >
      <i class="pi pi-star" aria-hidden="true"></i>
      <span class="nt-boton__texto">Califica a Katuq</span>
    </button>
    <ng-template #tarjeta>
      <aside
        class="nt-tarjeta"
        role="dialog"
        aria-modal="false"
        [attr.aria-labelledby]="e.paso === 'gracias' ? null : 'ntf-pregunta'"
        [attr.aria-label]="e.paso === 'gracias' ? 'Gracias por tu opinión' : null"
        (keydown.escape)="cerrar()"
      >
        <button type="button" class="nt-cerrar" (click)="cerrar()" aria-label="Cerrar">
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
        <app-nps-pregunta idBase="ntf"></app-nps-pregunta>
      </aside>
    </ng-template>
  </ng-container>
</ng-container>
