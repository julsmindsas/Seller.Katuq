<div class="floating-button-container opttia-launcher" *ngIf="authService.isLoggedIn"
  [class.open]="chatFormVisible" [class.minimized]="chatMinimized" [class.options-visible]="optionsPanelVisible">
  <button type="button" class="floating-button" (click)="toggleOptionsPanel($event)"
    [attr.aria-label]="optionsPanelVisible ? 'Cerrar menú de Opttia' : 'Abrir menú de Opttia'"
    [attr.aria-expanded]="optionsPanelVisible" aria-controls="opttia-menu"
    [class.active]="optionsPanelVisible" [class.has-unread]="hasUnreadMessages">
    <span class="launcher-symbol" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M15 5c1.5 7 3 8.5 10 10-7 1.5-8.5 3-10 10-1.5-7-3-8.5-10-10 7-1.5 8.5-3 10-10Z" fill="currentColor"/>
        <path d="M26 2v7M22.5 5.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="launcher-label">Opttia <span class="launcher-ai">IA</span></span>
    <i class="fa launcher-toggle" [ngClass]="optionsPanelVisible ? 'fa-times' : 'fa-angle-up'" aria-hidden="true"></i>
    <span class="launcher-unread" *ngIf="hasUnreadMessages" aria-label="Mensajes sin leer"></span>
  </button>

  <button type="button" class="mobile-menu-backdrop" *ngIf="optionsPanelVisible"
    (click)="closeEverything($event)" aria-label="Cerrar opciones de Opttia" tabindex="-1"></button>
  <section id="opttia-menu" class="opttia-menu" *ngIf="optionsPanelVisible"
    aria-labelledby="opttia-menu-title" (keydown.escape)="$event.stopPropagation(); closeEverything(null)">
    <header class="opttia-menu-header">
      <div>
        <span class="menu-eyebrow">TU ESPACIO DE AYUDA</span>
        <h2 id="opttia-menu-title">¿Qué necesitas hoy?</h2>
      </div>
      <button type="button" class="menu-close" (click)="closeEverything($event)" aria-label="Cerrar menú">
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </header>

    <div class="opttia-menu-body">
      <button type="button" class="opttia-feature" (click)="selectMode('opttia', $event)">
        <span class="feature-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M15 5c1.5 7 3 8.5 10 10-7 1.5-8.5 3-10 10-1.5-7-3-8.5-10-10 7-1.5 8.5-3 10-10Z" fill="currentColor"/>
            <path d="M26 2v7M22.5 5.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="feature-copy">
          <span class="feature-title">Hablar con Opttia <span class="feature-badge">IA</span></span>
          <span class="feature-description">Ventas, pedidos e inventario.<br>Tu negocio, en una conversación.</span>
          <span class="feature-action">Iniciar conversación <i class="fa fa-arrow-right" aria-hidden="true"></i></span>
        </span>
      </button>

      <!-- K.A.I. Chat, Voz y Live Audio están deprecados y no se ofrecen en este menú. -->
      <h3 class="menu-section-title">SOPORTE Y SEGUIMIENTO</h3>
      <nav class="support-links" aria-label="Soporte de Katuq">
        <button type="button" class="support-link" (click)="navigateTo('/soporte', $event)">
          <span class="support-icon" aria-hidden="true"><i class="fa fa-headphones"></i></span>
          <span class="support-copy"><strong>Contactar soporte</strong><small>Reporta un problema o propone una idea</small></span>
          <i class="fa fa-angle-right" aria-hidden="true"></i>
        </button>
        <button type="button" class="support-link" (click)="navigateTo('/misTickets', $event)">
          <span class="support-icon" aria-hidden="true"><i class="fa fa-ticket"></i></span>
          <span class="support-copy"><strong>Mis tickets</strong><small>Consulta respuestas y avances</small></span>
          <i class="fa fa-angle-right" aria-hidden="true"></i>
        </button>
        <button type="button" class="support-link" (click)="navigateTo('/misIdeas', $event)">
          <span class="support-icon" aria-hidden="true"><i class="fa fa-lightbulb-o"></i></span>
          <span class="support-copy"><strong>Mis ideas</strong><small>Sigue las mejoras que has propuesto</small></span>
          <i class="fa fa-angle-right" aria-hidden="true"></i>
        </button>
      </nav>
    </div>

    <footer class="opttia-menu-footer">
      <span>Estamos para ayudarte</span>
      <span class="menu-brand">Katuq</span>
    </footer>
  </section>

  <!-- Nuevo componente de agente de voz - Reemplaza toda la implementación anterior -->
  <!-- @deprecated Agente K.A.I. de voz conservado solo para compatibilidad. -->
  <app-voice-agent
    *ngIf="legacyKaiEnabled && selectedMode === 'voice'"
    [config]="voiceAgentConfig"
    [demoSteps]="demoSteps"
    [uiConfig]="{
      showVisualSteps: true,
      allowDragging: true,
      position: 'fixed',
      theme: 'default',
      showControls: true
    }"
    (sessionStarted)="saveState()"
    (sessionEnded)="stopVoiceMode(null)"
    (stepChanged)="currentStepIndex = $event.stepIndex"
    (errorOccurred)="onVoiceError($event)">
  </app-voice-agent>

  <!-- @deprecated K.A.I. Live Audio conservado solo para compatibilidad. -->
  <div *ngIf="legacyKaiEnabled && selectedMode === 'live-audio'" class="live-audio-container">
    <app-live-audio></app-live-audio>
    <button class="close-live-audio-btn" (click)="stopLiveAudioMode($event)" title="Cerrar Live Audio">
      <i class="fa fa-times"></i>
    </button>
  </div>

  <!-- Burbuja de chat minimizada -->
  <div *ngIf="chatMinimized" class="minimized-chat-bubble" (click)="maximizeChat($event)">
    <span class="minimize-text">Opttia</span>
    <span class="notification-indicator" *ngIf="hasUnreadMessages"></span>
    <button class="maximize-chat-btn" (click)="maximizeChat($event)">
      <i class="fa fa-expand"></i>
    </button>
  </div>

  <!-- Contenedor de chat completo -->
  <div *ngIf="chatFormVisible && !chatMinimized" class="floating-chat-overlay" [ngClass]="{'maximized': chatMaximized}">
    <!-- Barra de título del chat -->
    <div class="chat-header" (dblclick)="toggleChatSize($event)">
      <span class="chat-title">Opttia · Inteligencia operacional</span>
      <div class="chat-controls">
        <button class="chat-control-btn" (click)="toggleChatSize($event)" title="Cambiar tamaño">
          <i class="fa" [ngClass]="chatMaximized ? 'fa-compress' : 'fa-expand'"></i>
        </button>
        <button class="close-chat-btn" (click)="closeChat($event)" title="Cerrar">
          <i class="fa fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Contenedor del chat con estructura flexbox -->
    <div *ngIf="authService.isLoggedIn" class="floating-chat-container">
      <app-opttia-chat *ngIf="selectedMode === 'opttia'" class="floating-chat"
        (closeRequested)="closeChat($event)">
      </app-opttia-chat>
      <!-- @deprecated Chat K.A.I. conservado solo para compatibilidad. -->
      <app-chat *ngIf="legacyKaiEnabled && selectedMode === 'chat'" [isFloating]="true" class="floating-chat" (closeRequested)="closeChat($event)">
      </app-chat>
    </div>
  </div>
</div>
