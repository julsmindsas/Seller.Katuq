<!--
  Aviso de versión nueva en la barra superior
  (mockup "Banner Actualizacion", variante "En contexto · barra superior").
  No bloquea la pantalla: el usuario decide cuándo actualizar.
-->
<div class="act-pill" *ngIf="visible" [class.act-pill--busy]="aplicando">

  <!-- Disponible -->
  <ng-container *ngIf="!aplicando">
    <span class="act-dot">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><polyline points="5 12 12 5 19 12"></polyline></svg>
    </span>

    <div class="act-texto">
      <div class="act-linea1">
        <span class="act-version"><span class="act-version-pre">Actualización </span>{{ versionNueva }}</span>
        <span class="act-badge">NUEVO</span>
      </div>
      <div class="act-linea2">Mejoras y correcciones nuevas</div>
    </div>

    <span class="act-sep"></span>

    <button type="button" class="act-notas-btn" *ngIf="notas.length" (click)="verNotas()">
      {{ notasAbiertas ? 'Ocultar' : 'Ver notas' }}
    </button>

    <button type="button" class="act-actualizar" (click)="actualizar()">
      Actualizar
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>

    <button type="button" class="act-cerrar" title="Recordar más tarde" (click)="recordarLuego()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </ng-container>

  <!-- Aplicando -->
  <ng-container *ngIf="aplicando">
    <span class="act-spin"></span>
    <div class="act-texto">
      <div class="act-linea1">
        <span class="act-version">Actualizando a {{ versionNueva }}…</span>
      </div>
      <div class="act-linea2">{{ pasoTexto }}</div>
    </div>
  </ng-container>

  <!-- Notas de la versión -->
  <div class="act-notas-pop" *ngIf="notasAbiertas && !aplicando">
    <div class="act-notas-head">
      <span class="act-notas-titulo">Novedades de {{ versionNueva }}</span>
      <span class="act-notas-fecha" *ngIf="publicadaTexto">{{ publicadaTexto }}</span>
    </div>
    <div class="act-nota" *ngFor="let n of notas">
      <span [ngClass]="claseEtiqueta(n.tipo)">{{ textoEtiqueta(n.tipo) }}</span>
      <span class="act-nota-texto">{{ n.texto }}</span>
    </div>
  </div>
</div>
