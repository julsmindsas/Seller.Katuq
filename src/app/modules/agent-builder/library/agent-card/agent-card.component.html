<div class="google-card" (click)="onExecute()">
  <!-- Card Header -->
  <div class="card-header">
    <div class="header-top">
      <div class="icon-wrapper" [style.backgroundColor]="getDepartmentColor() + '20'">
        <i [class]="getDepartmentIcon()" [style.color]="getDepartmentColor()"></i>
      </div>
      <button class="more-btn" (click)="$event.stopPropagation(); menu.toggle($event)">
        <i class="pi pi-ellipsis-v"></i>
      </button>
    </div>

    <h3 class="agent-name">{{ agent.agentName }}</h3>
    <span class="department-label">{{ getDepartmentLabel() }}</span>
  </div>

  <!-- Card Body -->
  <div class="card-body">
    <p class="description">{{ agent.description || 'No description provided.' }}</p>

    <div class="stats-row">
      <div class="stat-item" pTooltip="Total Executions" tooltipPosition="top">
        <i class="pi pi-bolt"></i>
        <span>{{ getExecutionsCount() }}</span>
      </div>
      <div class="stat-item" pTooltip="Tools Available" tooltipPosition="top">
        <i class="pi pi-wrench"></i>
        <span>{{ getToolsCount() }}</span>
      </div>
      <div class="stat-item date" pTooltip="Last Used" tooltipPosition="top">
        <i class="pi pi-clock"></i>
        <span>{{ getLastExecuted() }}</span>
      </div>
    </div>
  </div>

  <!-- Card Footer -->
  <div class="card-footer">
    <div class="status-indicator" [class.active]="agent.status === 'active'">
      <span class="dot"></span>
      {{ agent.status === 'active' ? 'Active' : 'Inactive' }}
    </div>
  </div>
</div>

<!-- Context Menu -->
<p-menu #menu [popup]="true" [model]="menuItems" appendTo="body"></p-menu>
