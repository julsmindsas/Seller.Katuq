<div class="cfg-pagina google-wizard-container">
  <!-- Encabezado -->
  <header class="cfg-cabeza wizard-header">
    <div class="header-content">
      <div class="back-button" routerLink="/agent-builder/library">
        <i class="pi pi-arrow-left"></i>
      </div>
      <div class="cfg-cabeza__textos title-section">
        <span class="cfg-eyebrow">Agent Builder</span>
        <h1 class="cfg-titulo">Crear agente</h1>
        <p class="cfg-sub">Configure your AI assistant in a few simple steps</p>
      </div>
    </div>
    <div class="cfg-acciones">
      <div class="step-indicator">
        Step {{ activeStep + 1 }} of {{ steps.length }}
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="wizard-main">
    <section class="cfg-card wizard-card">
      <!-- Stepper -->
      <div class="stepper-wrapper">
        <p-steps [model]="steps" [(activeIndex)]="activeStep" [readonly]="false" styleClass="google-steps">
        </p-steps>
      </div>

      <!-- Step Content -->
      <div class="step-content-area">
        <!-- Step 1: Basic Info -->
        <app-step-basic-info *ngIf="activeStep === 0" [(agentConfig)]="agentConfig" (next)="nextStep()">
        </app-step-basic-info>

        <!-- Step 2: System Prompt -->
        <app-step-prompt *ngIf="activeStep === 1" [(agentConfig)]="agentConfig" (next)="nextStep()" (back)="prevStep()">
        </app-step-prompt>

        <!-- Step 3: Tools Selection -->
        <app-step-tools *ngIf="activeStep === 2" [(agentConfig)]="agentConfig" [toolCatalog]="toolCatalog"
          (next)="nextStep()" (back)="prevStep()">
        </app-step-tools>

        <!-- Step 4: Review & Create -->
        <app-step-review *ngIf="activeStep === 3" [agentConfig]="agentConfig" [isLoading]="isLoading"
          (back)="prevStep()" (create)="createAgent()">
        </app-step-review>
      </div>
    </section>
  </main>

  <!-- Loading Overlay -->
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="google-spinner"></div>
    <p>Creating your agent...</p>
  </div>
</div>
