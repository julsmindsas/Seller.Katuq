<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="woGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E86AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B4965;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background pill shape -->
  <rect x="2" y="2" width="116" height="36" rx="18" ry="18" fill="url(#woGradient)"/>
  <!-- WO text -->
  <text x="60" y="27" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
    World Office
  </text>
  <!-- Decorative globe icon -->
  <circle cx="18" cy="20" r="5" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  <ellipse cx="18" cy="20" rx="2.5" ry="5" fill="none" stroke="white" stroke-width="0.7" opacity="0.5"/>
  <line x1="13" y1="20" x2="23" y2="20" stroke="white" stroke-width="0.7" opacity="0.5"/>
</svg>
