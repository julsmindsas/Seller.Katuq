<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="siigoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background pill shape -->
  <rect x="2" y="2" width="116" height="36" rx="18" ry="18" fill="url(#siigoGradient)"/>
  <!-- Siigo text -->
  <text x="60" y="27" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    Siigo
  </text>
  <!-- Decorative dots representing data/accounting -->
  <circle cx="18" cy="20" r="3" fill="white" opacity="0.4"/>
  <circle cx="102" cy="20" r="3" fill="white" opacity="0.4"/>
</svg>
