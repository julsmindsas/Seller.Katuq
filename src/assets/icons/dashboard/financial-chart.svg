<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="financial-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1cc88a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17a673;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="12" cy="12" r="11" fill="url(#financial-gradient)" opacity="0.1"/>
  
  <!-- Dollar sign -->
  <path d="M12 2L12 4" stroke="url(#financial-gradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M12 20L12 22" stroke="url(#financial-gradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Main dollar curve -->
  <path d="M17 6.5C17 4.5 15 4 12 4C9 4 7 4.5 7 6.5C7 8.5 9 9 12 9C15 9 17 9.5 17 11.5C17 13.5 15 14 12 14C9 14 7 13.5 7 11.5" 
        stroke="url(#financial-gradient)" 
