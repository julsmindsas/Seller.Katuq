        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Chart bars background -->
  <rect x="2" y="16" width="1.5" height="6" fill="url(#financial-gradient)" opacity="0.3"/>
  <rect x="4.5" y="18" width="1.5" height="4" fill="url(#financial-gradient)" opacity="0.3"/>
  <rect x="7" y="17" width="1.5" height="5" fill="url(#financial-gradient)" opacity="0.3"/>
  
  <rect x="16.5" y="16" width="1.5" height="6" fill="url(#financial-gradient)" opacity="0.3"/>
  <rect x="19" y="18" width="1.5" height="4" fill="url(#financial-gradient)" opacity="0.3"/>
  <rect x="21.5" y="17" width="1.5" height="5" fill="url(#financial-gradient)" opacity="0.3"/>
  
  <!-- Coins -->
  <circle cx="4" cy="7" r="1.5" fill="url(#financial-gradient)" opacity="0.6"/>
  <circle cx="20" cy="7" r="1.5" fill="url(#financial-gradient)" opacity="0.6"/>
  <circle cx="4" cy="10" r="1" fill="url(#financial-gradient)" opacity="0.4"/>
  <circle cx="20" cy="10" r="1" fill="url(#financial-gradient)" opacity="0.4"/>
