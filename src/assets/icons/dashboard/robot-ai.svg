<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c757d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#495057;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ai-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#198754;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="12" cy="12" r="11" fill="url(#ai-gradient)" opacity="0.1"/>
  
  <!-- Robot head -->
  <rect x="7" y="8" width="10" height="8" rx="2" fill="url(#ai-gradient)"/>
  
  <!-- Robot eyes -->
  <circle cx="10" cy="11" r="1.5" fill="url(#ai-accent)"/>
  <circle cx="14" cy="11" r="1.5" fill="url(#ai-accent)"/>
  
  <!-- Eye pupils -->
  <circle cx="10" cy="11" r="0.5" fill="white"/>
  <circle cx="14" cy="11" r="0.5" fill="white"/>
  
  <!-- Robot mouth/speaker -->
  <rect x="9" y="13.5" width="6" height="1.5" rx="0.75" fill="url(#ai-accent)" opacity="0.8"/>
  
  <!-- Antenna -->
  <line x1="12" y1="8" x2="12" y2="5" stroke="url(#ai-gradient)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="5" r="1" fill="url(#ai-accent)"/>
  
  <!-- Robot body -->
  <rect x="8" y="16" width="8" height="6" rx="1" fill="url(#ai-gradient)" opacity="0.7"/>
  
  <!-- Control panel -->
  <circle cx="10" cy="18" r="0.5" fill="url(#ai-accent)" opacity="0.8"/>
  <circle cx="12" cy="18" r="0.5" fill="url(#ai-accent)" opacity="0.8"/>
  <circle cx="14" cy="18" r="0.5" fill="url(#ai-accent)" opacity="0.8"/>
  
  <!-- Arms -->
  <rect x="5" y="17" width="2" height="4" rx="1" fill="url(#ai-gradient)" opacity="0.6"/>
  <rect x="17" y="17" width="2" height="4" rx="1" fill="url(#ai-gradient)" opacity="0.6"/>
  
  <!-- Data stream -->
  <circle cx="4" cy="6" r="0.5" fill="url(#ai-accent)" opacity="0.6">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="6" cy="4" r="0.5" fill="url(#ai-accent)" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="6" r="0.5" fill="url(#ai-accent)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="18" cy="4" r="0.5" fill="url(#ai-accent)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg> 