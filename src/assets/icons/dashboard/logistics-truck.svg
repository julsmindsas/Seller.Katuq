<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logistics-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6c23e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dda20a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="12" cy="12" r="11" fill="url(#logistics-gradient)" opacity="0.1"/>
  
  <!-- Truck body -->
  <rect x="2" y="10" width="12" height="6" rx="1" fill="url(#logistics-gradient)"/>
  
  <!-- Truck cabin -->
  <rect x="14" y="8" width="6" height="8" rx="1" fill="url(#logistics-gradient)"/>
  
  <!-- Truck wheels -->
  <circle cx="6" cy="18" r="2" fill="url(#logistics-gradient)" opacity="0.8"/>
  <circle cx="16" cy="18" r="2" fill="url(#logistics-gradient)" opacity="0.8"/>
  
  <!-- Wheel rims -->
  <circle cx="6" cy="18" r="1" fill="white"/>
  <circle cx="16" cy="18" r="1" fill="white"/>
  
  <!-- Truck details -->
  <rect x="15" y="10" width="4" height="2" fill="white" opacity="0.8"/>
  <rect x="3" y="12" width="8" height="1" fill="white" opacity="0.6"/>
  
  <!-- Speed lines -->
  <path d="M1 6L3 6" stroke="url(#logistics-gradient)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M1 9L4 9" stroke="url(#logistics-gradient)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M2 12L5 12" stroke="url(#logistics-gradient)" stroke-width="1.5" stroke-linecap="round"/>
</svg> 