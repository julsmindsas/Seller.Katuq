<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#07172d"/>
  <circle cx="950" cy="90" r="180" fill="#0d3651"/>
  <text x="70" y="96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2" fill="#68dcff">WEBMCP · BAJO EL CAPÓ</text>
  <text x="70" y="181" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#ffffff">¿Qué cambia</text>
  <text x="70" y="255" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#ffffff">técnicamente?</text>

  <rect x="70" y="320" width="940" height="222" rx="28" fill="#10243b" stroke="#284760" stroke-width="2"/>
  <rect x="94" y="346" width="128" height="38" rx="19" fill="#ff856d"/>
  <text x="158" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#08172b">HOY</text>
  <text x="100" y="440" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#ffffff">Agente</text>
  <text x="245" y="440" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#8baac1">→ ve pantalla → interpreta → hace clic</text>
  <text x="100" y="492" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffab9b">Lento · frágil · dependiente del diseño visual</text>

  <rect x="70" y="568" width="940" height="312" rx="28" fill="#0b2d43" stroke="#43c7eb" stroke-width="2"/>
  <rect x="94" y="594" width="220" height="38" rx="19" fill="#68dcff"/>
  <text x="204" y="621" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#07172d">CON WEBMCP</text>
  <text x="100" y="688" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#ffffff">Sitio</text>
  <text x="220" y="688" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#a4d9ea">→ registra tools → navegador revisa → agente ejecuta</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <rect x="100" y="736" width="190" height="52" rx="26" fill="#123f57"/><text x="195" y="770" text-anchor="middle" fill="#68dcff">schema JSON</text>
    <rect x="310" y="736" width="178" height="52" rx="26" fill="#123f57"/><text x="399" y="770" text-anchor="middle" fill="#68dcff">estado vivo</text>
    <rect x="508" y="736" width="282" height="52" rx="26" fill="#123f57"/><text x="649" y="770" text-anchor="middle" fill="#68dcff">resultado verificable</text>
  </g>
  <text x="100" y="838" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#d7edf7">La herramienta vive en la página y reutiliza su lógica y permisos.</text>

  <rect x="70" y="920" width="940" height="286" rx="28" fill="#0b1220" stroke="#24394d" stroke-width="2"/>
  <text x="100" y="968" font-family="Menlo, Monaco, monospace" font-size="22" fill="#83a9c2">document.modelContext.registerTool({</text>
  <text x="136" y="1010" font-family="Menlo, Monaco, monospace" font-size="22" fill="#68dcff">name: "search_catalog",</text>
  <text x="136" y="1052" font-family="Menlo, Monaco, monospace" font-size="22" fill="#ffffff">inputSchema: { /* JSON Schema */ },</text>
  <text x="136" y="1094" font-family="Menlo, Monaco, monospace" font-size="22" fill="#ffffff">execute: async (args) =&gt; resultado</text>
  <text x="100" y="1136" font-family="Menlo, Monaco, monospace" font-size="22" fill="#83a9c2">})</text>
  <text x="70" y="1281" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#b9d3e8">La IA ya no adivina dónde hacer clic: descubre qué puede hacer.</text>
  <text x="1010" y="1281" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#68dcff">2 / 4</text>
</svg>
